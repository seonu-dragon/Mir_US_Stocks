name: _tmp KRX short check

# 임시 진단용. Actions 미국 러너에서 KRX 회원 로그인(pykrx)이 되고 공매도 잔고가
# 실제로 수집되는지만 확인한다. 발행/커밋/배포 없음(--push 안 붙임). 확인 후 삭제.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-actions.txt
      - name: Install dependencies
        run: pip install -r scripts/requirements-actions.txt
      - name: Collect KR short interest (no push)
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/build_kr_short_interest.py
