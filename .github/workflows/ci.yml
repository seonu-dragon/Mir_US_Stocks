name: CI

# PR 마다 도는 최소 검사. 데이터를 커밋하지 않으므로 deploy-pages.yml 의 트리거
# 목록에 넣지 않는다(scripts/check_deploy_triggers.py 의 NOT_DATA_WORKFLOWS 참조).
on:
  pull_request:
  # main 직접 푸시(핫픽스·머지 커밋)도 검사한다. PR 만 걸어 두면 main 에 바로 들어간
  # 변경은 아무 게이트도 통과하지 않는다. 데이터 워크플로우의 GITHUB_TOKEN push 는
  # 이벤트를 만들지 않으므로(재귀 방지) 사람 푸시에만 걸린다.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-actions.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pip install -r scripts/requirements-actions.txt pytest pyyaml

      # 워크플로우 name: 이 deploy-pages.yml 의 workflow_run 참조·app.js 안내와 맞는지.
      # 어긋나면 데이터가 레포에만 쌓이고 사이트는 멈춘다(2026-07-17 실제 사고).
      - name: Workflow trigger names
        run: python scripts/check_deploy_triggers.py

      # ?v= 캐시버스터·MIR_BUILD_ID·sw.js BUILD_ID_FALLBACK 이 자산 내용 해시와 맞는지.
      # 해시는 CRLF→LF 정규화본으로 계산하므로 Windows 작업트리와 리눅스 러너가 같은
      # 값을 낸다(stamp_build_id.normalized_bytes) — 예전의 continue-on-error 사유는
      # 해소됐고 2026-09-15 에 제거했다. 어긋나면 사용자가 옛 JS 를 계속 받는다.
      - name: Build id stamps (?v= / MIR_BUILD_ID / sw.js)
        run: python scripts/stamp_build_id.py --check

      # 충돌 해결 중 남은 <<<<<<< / >>>>>>> 표시가 커밋되지 않았는지.
      - name: No merge conflict markers
        run: python scripts/check_merge_markers.py

      - name: CSS brace balance
        run: python scripts/check_css_balance.py

      # index/analysis 에 인라인된 critical CSS 가 styles.css 와 동기인지.
      - name: Critical CSS in sync
        run: python scripts/sync_critical_css.py --check

      # sitemap.xml 이 유효한지(생성물 — 직접 편집 금지). 생성은 주간(weekly-edge-stats)
      # 이라 글자 단위 비교는 lastmod·시총 순서 때문에 매일 실패했다 — --check 는 이제
      # URL 집합으로 본다: 상세 JSON 없는 종목 URL 은 즉시 실패, 기대 집합과 10% 넘게
      # 어긋나면 실패(시총 경계 교체·lastmod 는 허용). 그래서 다시 하드 게이트다.
      - name: Sitemap valid
        run: python scripts/build_sitemap.py --check

      - name: Global name collisions (if the checker exists)
        run: |
          if [ -f scripts/check_global_name_collisions.py ]; then
            python scripts/check_global_name_collisions.py
          else
            echo "scripts/check_global_name_collisions.py 없음 — 건너뜀"
          fi

      - name: JS syntax (root *.js + worker)
        run: |
          set -e
          for f in *.js worker/*.js; do node --check "$f"; done

      # 워커 단위 테스트(네트워크 없음 — fetch 목). 워커는 대시보드 수동 배포라 CI 가
      # 유일한 자동 검증이다. KR 지수 네이버 기준·실적 폴백 가용성 테스트 포함.
      - name: Worker tests
        run: node worker/test_worker.mjs

      # Web Push 워커(worker/mir-push.js): RFC 8291 부록 A 벡터(바이트 일치)·VAPID ES256 서명 검증·라우트(Origin·구독 검증·
      # 쿨다운·410 정리)·크론(±N%·가격 도달·상한·예산 커서·요약·동기화 목록). EMBED 블록이 루트 원본과 같은지도 본다.
      - name: Web Push worker tests
        run: |
          node scripts/sync_push_worker.mjs --check
          node worker/test_push.mjs
      # 정시 실행 워커(worker/mir-cron.js) + 감시자(scripts/cron_watchdog.mjs): cron 해석·재시도 오프셋·멱등 dispatch·
      # cron 입력 전달·예약표 원격/EMBED. --check 는 워크플로우 `# mir-cron:` 주석 ↔ .github/mir-cron.json ↔ EMBED 동기와
      # `schedule:` 이 감시자 외에 남지 않았는지(남으면 하루 두 번 돈다)를 본다.
      - name: Cron dispatch worker tests
        run: |
          node scripts/sync_cron_worker.mjs --check
          node worker/test_cron.mjs
      # 푸시 알림 순수 로직(push-alerts-core.js): 설정·목록 정리, 크론 계획(서머타임·KST 슬롯), spark 파싱, 조건 평가, 상한·문구.
      - name: Push alerts core tests
        run: node scripts/tests/test_push_alerts_core.mjs

      # 적립식 시뮬레이터 순수 계산(dca-core.js): XIRR 알려진 값·휴장일 이월·정수 매수 이월·배당.
      - name: DCA simulator tests
        run: node scripts/tests/test_dca_core.mjs
      # ETF 룩스루(lookthrough-core.js: 직접+ETF 경유 합산·가중 중복도·섹터) + 증권사 CSV 가져오기
      # (broker-csv-core.js: CP949 판별·키움/일반/Mir 형식·종목명 매칭, 픽스처 scripts/tests/fixtures/broker_csv).
      - name: Lookthrough / broker CSV tests
        run: |
          node scripts/tests/test_lookthrough_core.mjs
          node scripts/tests/test_broker_csv_core.mjs
      # 산업 지표 차트(industry-chart-core.js + industry.js industryChartSvg): 날짜 비례 x·막대 폭·눈금 단위 테스트,
      # 그리고 커밋된 data/industry_indicators.js 의 지표 전부 × 기간·변환·밴드·겹치기 × 데스크톱/모바일 폭을 그려
      # 플롯 밖 도형·잘린/겹친 축 라벨·날짜 역순/중복/미래·빈 시리즈를 검사한다.
      - name: Industry chart tests
        run: |
          node scripts/tests/test_industry_chart_core.mjs
          node scripts/tests/test_industry_charts.mjs

      # 시장지표 표기(market-indicators-core.js): 쉼표·▲1.23(+0.45%)·만기월·스파크라인 경로.
      - name: Market indicators core tests
        run: node scripts/tests/test_market_indicators_core.mjs
      # 통합 캘린더 순수 계산(calendar-panel-core.js): 날짜·주/월 격자·데이터셋 정규화·칩/관심종목 필터·날짜별 묶음.
      - name: Calendar panel core tests
        run: node scripts/tests/test_calendar_panel_core.mjs
      # "오늘 내 주식은" 보유·관심 요약(my-digest-core.js): 사건 정규화·업종 평균·기여도·일간/주간 조립·추천 문구 없음.
      - name: My digest core tests
        run: node scripts/tests/test_my_digest_core.mjs
      # 보호예수 해제(lockup-core.js): 종목별 해제·N일 안 해제 정렬·주식수/금액 표기·공모 수요예측 항목.
      - name: Lockup core tests
        run: node scripts/tests/test_lockup_core.mjs
      # 오늘 탭 지수 하루 차트 시간축(home-chart-core.js): 5분 봉 시각 배정·장 상태(장중/마감/휴장/단축)·눈금.
      - name: Home chart core tests
        run: node scripts/tests/test_home_chart_core.mjs

      # PER 기준 판정(per-basis-core.js): 국내 최근 4분기/연간/KRX 사업연도 라벨·현재가 재계산.
      - name: PER basis core tests
        run: node scripts/tests/test_per_basis_core.mjs

      # 가격 축 세로 스케일 순수 계산(chart-yscale-core.js): 선형/로그 변환·축 드래그 줌·세로 팬·
      # 눈금 간격(1·2·2.5·5)·자동 맞춤 해제/복귀. 종목 분석 차트와 AI 모드 차트가 같이 쓴다.
      - name: Chart price-axis scale tests
        run: node scripts/tests/test_chart_yscale_core.mjs

      # 투자 가설 추적 순수 계산(thesis-core.js): 조건 위반/근접 판정·이력 보존·벤치마크 대비 성적·병합·클라우드 축약.
      - name: Thesis tracker tests
        run: node scripts/tests/test_thesis_core.mjs
      # PER·PBR 밴드 순수 계산(valuation-band-core.js): 분위·백분위·적자 끊김·샤드 해시(PY 와 동일).
      - name: Valuation band tests
        run: node scripts/tests/test_valuation_band_core.mjs

      # 국내 수급·증시자금 순수 계산(kr-flow-core.js): 샤드 해시(PY 와 동일)·부호 포맷·막대/누적 기하.
      - name: KR flow core tests
        run: node scripts/tests/test_kr_flow_core.mjs
      # 국내 테마 순수 계산(kr-themes-core.js): 동일/시총가중 등락·결측·저PBR 조건·순위·근거 문장 강조 조각.
      - name: KR themes core tests
        run: node scripts/tests/test_kr_themes_core.mjs
      # 수식 스크리너 파서·평가기(formula-core.js): 연산자 우선순위·괄호·결측(3값 논리)·0 나누기·
      # 그룹 집계(sectorMedian/sectorPct/rank)·오류 메시지·eval 미사용·공유 토큰 왕복.
      - name: Formula screener tests
        run: node scripts/tests/test_formula_core.mjs
      # 찾기 › 필터 목록(named-filters-core.js): 정의(평가어 없는 이름·시장별 필드·수식 컴파일)·선택 우선순위·
      # 개수(formula-core 와 동일)·과거 결과 문장(정의가 바뀌면 숨김) + 커밋된 named_filter_stats 가 정의와 맞는지.
      - name: Named filters core tests
        run: node scripts/tests/test_named_filters_core.mjs
      # 업종 상대 팩터 등급(factor-grade-core.js): 업종 내 백분위·섹터 승격·표본 부족 보류·검증 요약 문구.
      - name: Factor grade tests
        run: node scripts/tests/test_factor_grade_core.mjs
      # 펀더멘털 이상치 규칙(fundamentals-sanity-core.js): 정의상 무의미 값 결측·이상치 경계·정렬 순서.
      # 사례 파일은 파이썬(test_fundamentals_sanity.py)과 공유 — 두 구현이 같은 답을 내야 한다.
      - name: Fundamentals sanity tests
        run: node scripts/tests/test_fundamentals_sanity_core.mjs
      # 스크리너 과거 백테스트(screener-backtest-core.js) + 공통 과적합 검사(overfit-core.js):
      # DSR 알려진 값(Bailey & López de Prado 2014)·룩어헤드 없음·거래비용/회전율·현금 처리·배지 판정.
      - name: Screener backtest tests
        run: node scripts/tests/test_screener_backtest_core.mjs
      # 신호 성적표 순수 계산(signal-scorecard-core.js): 진입 기준일(룩어헤드 차단)·수익률·중복 처리·
      # 부트스트랩 판정 + 커밋된 원장의 해시 체인(소급 수정·삭제가 없었는지).
      - name: Signal scorecard tests
        run: |
          node scripts/tests/test_signal_scorecard_core.mjs
          node scripts/build_signal_ledger.mjs --verify
      # 이벤트 스터디 순수 집계(event-study-core.js): 기준점 재정렬·날짜 묶음 부트스트랩(신호 성적표와 같은 구간)·
      # 날짜 동일 가중·BH-FDR·군집 경고·종목 샤드(파이썬 crc32 와 동일).
      - name: Event study tests
        run: node scripts/tests/test_event_study_core.mjs
      # 재무 확장 파생 지표(financials-core.js): ROIC·순차입금/EBITDA·주식수 증감·TTM 시계열(연속 분기만)·결측 전파.
      - name: Financials core tests
        run: node scripts/tests/test_financials_core.mjs
      # 재무 차트 시가총액 겹쳐 보기(mcap-core.js: 분할 환산 — NVDA 10:1·000500 무상증자 1.8배, 수정주가 대체·건너뜀) +
      # 주주환원(shareholder-core.js: 배당 주기·연도/회계연도 합·배당성향 적자·자사주 공시·주식수 변화).
      - name: Market-cap overlay / shareholder core tests
        run: |
          node scripts/tests/test_mcap_core.mjs
          node scripts/tests/test_shareholder_core.mjs
      # 재무 위험 점검(risk-check-core.js): Piotroski 9항목·Altman Z/Z''·Beneish M 교과서 값 검산, 데이터 없음 분리.
      - name: Risk check core tests
        run: node scripts/tests/test_risk_check_core.mjs
      # 사업부문·지역별 매출(segments-core.js): 상위 멤버+기타 묶음, 비중·전년비·3년 연평균, 합계 대조 문장.
      - name: Segments core tests
        run: node scripts/tests/test_segments_core.mjs
      # 10-K 위험요인 변화(risk-factors-core.js): 인덱스 행 해석·백분위 문장·헤드라인·목록 자르기.
      - name: Risk factors core tests
        run: node scripts/tests/test_risk_factors_core.mjs
      # 역DCF · 시나리오 DCF(dcf-core.js): 역산 수렴·알려진 DCF 값·음수 FCF/금융업 거부·민감도 격자·기저율·URL 인코딩.
      - name: DCF core tests
        run: node scripts/tests/test_dcf_core.mjs
      # 종목 시세정보·투자정보(quote-info-core.js): 52주 고저·날짜(종가/장중), 세션 봉, 배당 합, 괴리율,
      # 액면분할 표기, 재무비율 TTM(적자·자본잠식·통화 불일치·금융업), 동일업종 중앙값, 억/조·$B·원화 병기 표기.
      - name: Quote info core tests
        run: node scripts/tests/test_quote_info_core.mjs

      # 종목 분석 '현재' 시세(live-quote-core.js): 분봉/워커 quote → 현재가·전일 종가 대비 등락, 장중/마감/새 거래 없음 판정.
      - name: Live quote core tests
        run: node scripts/tests/test_live_quote_core.mjs
      # 기업개요·목표주가 범위(company-info-core.js): 샤드 번호 = 파이썬 crc32, 결산월, 범위 바 위치(현재가 범위 밖 포함),
      # 평균 목표가 서술(권유 문구 없음), 의견 분포 비율.
      - name: Company info core tests
        run: node scripts/tests/test_company_info_core.mjs
      # 종목별 기관 보유 변화(inst-holders-core.js): 요약 수치(분할 추정 시 직전 수량 조정), 신규/증가/감소/청산 막대,
      # 상위 기관 상태(직전 13F 없음 = 비교 불가), 분기 추이 스파크라인(빈 분기에서 선 끊기), 표시 형식.
      - name: Institutional holders core tests
        run: node scripts/tests/test_inst_holders_core.mjs

      # 회사 로고(company-logo-core.js): 인덱스 조회·우선주→보통주 로고·모노그램 글자·팔레트 번호.
      - name: Company logo core tests
        run: node scripts/tests/test_company_logo_core.mjs
      # 종목 체력·유사종목·위험(stock-health-core.js): 스노우플레이크 통과 수/분모, %→배수, 적자 제외,
      # 피어 산업군→섹터 폴백·시총순, 변동성·낙폭·월별 평균(무효 종가 행 건너뜀).
      - name: Stock health core tests
        run: node scripts/tests/test_stock_health_core.mjs

      # 포트폴리오 위험 분석 순수 계산(portfolio-risk-core.js): Ledoit-Wolf(scikit-learn 값)·리스크 패리티 수렴·
      # 최소분산(상한)·낙폭 구간·월별 수익·empyrical 지표·위기 재생 경로.
      - name: Portfolio risk tests
        run: node scripts/tests/test_portfolio_risk_core.mjs

      # 찾기 › 상위 종목 표의 열 설정·목록(find-table-core.js): 시장별 열·저장값 정리·켜기/끄기·순서·배당 랭킹·신규상장·관리/경보.
      - name: Find table core tests
        run: node scripts/tests/test_find_table_core.mjs

      # 시장지도 극소 타일 묶기(treemap-core.js): 면적 기준 분할·전부 작을 때 처리·시총가중 평균.
      - name: Treemap core tests
        run: node scripts/tests/test_treemap_core.mjs

      # 가격 차트 이벤트 마커(chart-events-core.js): 실적·배당락·분할·8-K/DART 모으기, 휴장일 → 다음 봉 매핑,
      # 보이는 구간 자르기, 겹침 묶기(줌에 따라 풀림), 포인터 히트 판정.
      - name: Chart event marker tests
        run: node scripts/tests/test_chart_events_core.mjs

      # 종목 통합 타임라인·차트 키 모먼트(timeline-core.js): 공시·실적·배당·지분·특징주 모으기(rcpNo 합치기),
      # 큰 등락 판정(직전 60일 표준편차 대비), ±1거래일 사유 붙이기, 보이는 구간 자르기.
      - name: Timeline core tests
        run: node scripts/tests/test_timeline_core.mjs

      # 종목 상세 한눈 요약·오늘·임박 이벤트(stock-summary-core.js): 조사(은/는)·금액 단위·전년 대비(흑자/적자 전환),
      # 빠진 절 생략(자리표시 없음)·ETF/빈 데이터 숨김, 5개년 표, 실적 D-7·배당·보호예수·새 공시 묶음·가까운 순.
      - name: Stock summary core tests
        run: node scripts/tests/test_stock_summary_core.mjs

      # 8-K 3줄 요약·Form 144 표시(sec-filings-core.js): AI > 규칙 > 없음 우선순위, 출처 라벨,
      # Form 144 발행주식 대비 %·Form 4 짝짓기 상태 문구, 타임라인 항목에 요약 줄·Form 144 항목.
      - name: SEC filings (8-K summary · Form 144) core tests
        run: node scripts/tests/test_sec_filings_core.mjs

      # 일별 시세 표(daily-table-core.js): 전일대비 ▲/▼ 금액·등락률, 보합, 거래량 0, 표기.
      - name: Daily price table tests
        run: node scripts/tests/test_daily_table_core.mjs
      # 월별 시즈널리티(seasonality-core.js): 월말 종가 수익률·진행 중인 달 제외·공백 달·상승 확률.
      - name: Seasonality core tests
        run: node scripts/tests/test_seasonality_core.mjs

      # 국내↔미국 연관 종목(cross-market-core.js): 사람이 정한 관계 우선 정렬·자동 후보 거르기,
      # 간밤 미국/국내 장 보드(문턱·방향별 상관·표본 부족 제외), 표기.
      - name: Cross-market links core tests
        run: node scripts/tests/test_cross_market_core.mjs

      # 오늘 탭 › 오늘 피드(market-feed-core.js): 8-K·실적·특징주·Form 4·Form 144·경제지표 / DART·IR·보호예수를 하루 피드로 합치기,
      # 기준일(오늘·주말·휴장·수집 전), 하루 정렬, 칩 개수 = 필터 행 수, 출처별 기준 시각, 판정 문구 금지.
      - name: Market feed core tests
        run: node scripts/tests/test_market_feed_core.mjs

      # 업데이트 소식(changelog-core.js): 안 읽음·화면별 '새 기능' 카드 고르기 + 손으로 쓰는 data/changelog.{json,js}
      # 가 같은 내용인지, 링크가 상대 URL 인지, targets/focus 요소 id 가 index/analysis.html 에 있는지.
      - name: Changelog core tests
        run: node scripts/tests/test_changelog_core.mjs

      # 배포 번들이 만들어지고(페이지별 이어붙이기 + esbuild 압축) 한 스크립트로 파싱되는지.
      - name: Bundle build (dry run, minified)
        run: |
          npx --yes esbuild@0.24.2 --version
          node scripts/build_bundle.mjs --check --minify --esbuild "npx --yes esbuild@0.24.2"

      - name: Workflow YAML parses
        run: python -c "import yaml,glob;[yaml.safe_load(open(f,encoding='utf-8')) for f in glob.glob('.github/workflows/*.yml')]"

      - name: Python byte-compile (scripts/)
        run: python -m compileall -q scripts

      # 빌더 계약(55개) · 증분 병합 · briefing_store · git_publish · 신선도 게이트 ·
      # KR 차트 결측 회귀 · JS↔PY 패리티. 전부 오프라인·결정적이라 1분 안에 끝난다.
      - name: pytest (scripts)
        run: python -m pytest -q scripts

      - name: pytest (automation)
        run: python -m pytest -q automation/tests
