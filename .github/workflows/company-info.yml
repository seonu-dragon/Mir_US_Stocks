name: Company profile & price targets

# 종목 분석 뷰의 "기업개요" 카드와 US "목표주가 범위" 카드(company-info.js).
# - profile 잡(수요일): scripts/build_company_profile.py — US SEC submissions(시총 상위 1,500, 키 불필요, ~3분)
#   + KR DART 기업개황·직원현황(증분). DART 하루 한도(2만)는 KR 일간 워크플로우·일요일 주간 잡과 나눠 쓰므로
#   일요일을 피하고 실행당 호출 상한(기본 2,500)을 둔다 — 없던 회사부터 받고 다음 주에 이어 받는다.
# - targets 잡(수·토): scripts/build_us_price_targets.py — Nasdaq analyst/targetprice, 시총 상위 1,000(1건 ~3초, ~55분).
# - logos 잡(수요일): scripts/build_company_logos.py — 시총 상위 1,000/시장의 회사 공식 홈페이지 파비콘을
#   64px WebP 로 줄여 data/logos/ 에 저장(키 불필요, 첫 실행 ~20분·이후 증분). 브라우저는 외부 로고 서비스를 부르지 않는다.
# - themes 잡(토요일): scripts/build_kr_themes.py — 국내 테마 분류. DART 사업보고서 'II. 사업의 내용' 원문에서
#   테마 근거 문장을 규칙으로 찾아 편입한다(시장 탭 '테마'·종목 '이 종목의 테마' 칩). 사업보고서 목록(list.json
#   40~60콜) + 접수번호가 바뀐 종목의 원문(document.xml)만 시총 순으로 실행당 --max-docs(기본 600)까지 — 처음
#   전체 채우기는 몇 주에 걸친다(dispatch 로 max_docs 를 늘려 앞당길 수 있다). 수요일 profile 잡(DART 2,500콜)과
#   날을 나눴다. GEMINI_API_KEY 가 있으면 규칙으로 애매한 문장만 flash-lite 로 판정(실행당 40건 = 최대 2콜),
#   없거나 한도면 애매한 문장은 편입하지 않고 다음 실행을 기다린다.
# 네 잡 모두 바뀐 파일만 다시 쓴다(data/company_profile/, data/us_price_targets/, data/logos/, data/korea/themes/).

on:
  # 정시 실행: Cloudflare 워커 mir-cron 이 아래 시각(UTC cron)에 workflow_dispatch 로 깨운다.
  # GitHub `schedule:` 은 5~8시간 늦게 출발해 2026-10-01 에 옮겼다 — DEPLOY.md "정시 실행 워커".
  # 시각을 바꾸면 `node scripts/sync_cron_worker.mjs` 로 .github/mir-cron.json 을 다시 만든다.
  # mir-cron: "17 1 * * 3"   # 수요일 10:17 KST — profile + targets
  # mir-cron: "17 1 * * 6"   # 토요일 10:17 KST — targets + themes
  workflow_dispatch:
    inputs:
      job:
        description: "profile | targets | logos | themes | all"
        default: "all"
      theme_max_docs:
        description: "KR 테마 — 이번 실행에 읽을 사업보고서 원문 상한(처음 전체 채우기는 2800, DART 호출 여유가 있는 날에)"
        default: "600"
      kr_max_calls:
        description: "KR DART 호출 상한(처음 전체 채우기는 5200 — 다른 DART 워크플로우가 적은 날에)"
        default: "2500"
      cron:
        description: "예약 슬롯(UTC cron) — Cloudflare 워커 mir-cron 이 넣는다. 손으로 돌릴 땐 비워 둔다"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: mir-publish-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  profile:
    if: ${{ (github.event.schedule || inputs.cron) == '17 1 * * 3' || (github.event_name == 'workflow_dispatch' && inputs.cron == '' && (inputs.job == 'profile' || inputs.job == 'all')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-actions.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-actions.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Company profile (SEC + DART)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KR_MAX_CALLS: ${{ inputs.kr_max_calls || '2500' }}
        run: python scripts/build_company_profile.py --market all --max-calls "$KR_MAX_CALLS" --push

      - name: Data freshness gate
        run: python scripts/check_data_freshness.py --group company-profile

      - name: Notify failure (Telegram)
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          MSG="[Mir Actions 실패] ${{ github.workflow }} (profile) ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" >/dev/null

  themes:
    if: ${{ (github.event.schedule || inputs.cron) == '17 1 * * 6' || (github.event_name == 'workflow_dispatch' && inputs.cron == '' && (inputs.job == 'themes' || inputs.job == 'all')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-actions.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-actions.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: KR themes (DART business reports)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KR_THEME_MAX_DOCS: ${{ inputs.theme_max_docs || '600' }}
        run: python scripts/build_kr_themes.py --max-docs "$KR_THEME_MAX_DOCS" --push

      - name: Data freshness gate
        run: python scripts/check_data_freshness.py --group kr-themes

      - name: Notify failure (Telegram)
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          MSG="[Mir Actions 실패] ${{ github.workflow }} (themes) ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" >/dev/null

  targets:
    if: ${{ github.event_name == 'schedule' || inputs.cron != '' || inputs.job == 'targets' || inputs.job == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-actions.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-actions.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: US price targets (Nasdaq)
        run: python scripts/build_us_price_targets.py --top 1000 --push

      - name: Data freshness gate
        run: python scripts/check_data_freshness.py --group price-targets

      - name: Notify failure (Telegram)
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          MSG="[Mir Actions 실패] ${{ github.workflow }} (targets) ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" >/dev/null

  logos:
    if: ${{ (github.event.schedule || inputs.cron) == '17 1 * * 3' || (github.event_name == 'workflow_dispatch' && inputs.cron == '' && (inputs.job == 'logos' || inputs.job == 'all')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-actions.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-actions.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Company logos (official-site favicons)
        run: python scripts/build_company_logos.py --market all --top 1000 --push

      - name: Data freshness gate
        run: python scripts/check_data_freshness.py --group company-logos

      - name: Notify failure (Telegram)
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          MSG="[Mir Actions 실패] ${{ github.workflow }} (logos) ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" >/dev/null
