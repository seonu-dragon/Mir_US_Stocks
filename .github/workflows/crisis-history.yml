name: Crisis history (stress replay)

# 내 투자 › 도구 › 스트레스 테스트의 '과거 위기 재생' 데이터(data/crisis_history.*).
# 2008·2018 Q4·2020 코로나 구간의 종목 가격 경로(시가총액 상위 US 250 · KR 150)와 대리 지수
# (SPY·섹터 SPDR·코스피·코스닥)의 다섯 구간 + 최근 3년 종가를 Yahoo 일봉으로 받는다
# (scripts/build_crisis_history.py). 과거 구간이라 이미 받은 종목은 다시 받지 않고, 새로 상위에 든
# 종목·상장 전 확인·대리 지수(β 추정용 최근 3년)만 갱신한다 — 보통 60~80콜, 1분 안팎.

on:
  schedule:
    - cron: "23 2 1 * *"  # 매월 1일 11:23 KST
  workflow_dispatch:
    inputs:
      refetch:
        description: "이미 받은 종목도 전부 다시 받기(약 400콜)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mir-publish-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-actions.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-actions.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build crisis history
        shell: bash
        run: |
          if [ "${{ github.event.inputs.refetch }}" = "true" ]; then
            python scripts/build_crisis_history.py --refetch --push
          else
            python scripts/build_crisis_history.py --push
          fi

      - name: Freshness gate
        run: python scripts/check_data_freshness.py --group crisis-history

      - name: Notify failure (Telegram)
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          MSG="[Mir Actions 실패] ${{ github.workflow }} ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" >/dev/null
