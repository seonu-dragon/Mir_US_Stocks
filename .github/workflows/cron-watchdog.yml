name: Cron watchdog

# 정시 실행의 보험. 예약 시각은 Cloudflare 워커 mir-cron 이 지킨다(worker/mir-cron.js,
# DEPLOY.md "정시 실행 워커") — 워커가 죽으면(토큰 만료·배포 해제·크론 삭제) 모든 데이터 갱신이 멈춘다.
# 이 감시자는 GitHub schedule 로 매시 돌며(늦게 출발해도 괜찮다), 슬롯 후 90분이 지나도 run 이 없는
# 예약을 대신 dispatch 하고 텔레그램으로 알린다. 그래서 이 파일과 pages-queue-watchdog.yml 만은
# `schedule:` 을 그대로 둔다(scripts/sync_cron_worker.mjs 의 GITHUB_SCHEDULE_ALLOWED).
# 데이터를 커밋하지 않으므로 deploy-pages.yml 의 트리거 목록에 넣지 않는다.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cron-watchdog
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/mir-cron.json
            worker/mir-cron.js
            scripts/cron_watchdog.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Dispatch slots mir-cron missed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
          MISSED_OUT: ${{ runner.temp }}/missed.txt
        run: node scripts/cron_watchdog.mjs

      - name: Notify missed slots (Telegram)
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MISSED_OUT: ${{ runner.temp }}/missed.txt
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          if [ ! -s "$MISSED_OUT" ]; then exit 0; fi
          MSG="[Mir 정시 실행] Cloudflare mir-cron 이 놓친 예약을 감시자가 대신 실행했습니다 — 워커 상태(토큰·크론) 확인 필요
          $(cat "$MISSED_OUT")
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" >/dev/null
