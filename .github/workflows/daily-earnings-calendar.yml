name: Daily earnings calendar

on:
  schedule:
    # 21:30 UTC — EDT 17:30 / EST 16:30 ET (마감 이후).
    - cron: "30 21 * * *"  # 06:30 KST (UTC+9) — 매일 US 스냅샷(06:05) 직후 갱신
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mir-publish-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  earnings-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # 얕은 체크아웃으로 충분하다 — 빌더의 fetch → pull --rebase → push 는 depth 1
          # 에서도 동작하고, 2.5GB 짜리 .git pack 을 run 마다 받지 않는다.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-actions.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-actions.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build US earnings calendar
        run: python scripts/build_earnings_calendar.py --limit 120 --push
      # 실적 전 비교: 과거 실적 반응(SEC 8-K 2.02 시각 + 일봉) vs 옵션 예상변동폭(반응일 뒤
      # 첫 만기). 방금 만든 실적 캘린더를 입력으로 쓴다. 키 불필요(SEC UA · 야후 크럼).
      - name: Earnings move compare (past reaction vs options)
        continue-on-error: true
        run: python scripts/build_earnings_move_compare.py --push
      - name: Data freshness gate
        run: python scripts/check_data_freshness.py --group earnings-move
      # 실패 시 텔레그램 통지 — 신선도 감시가 워크플로우를 빨갛게 만들어도
      # Actions 탭을 안 보면 모른다. 마지막 관문의 알림 루프를 여기서 닫는다.
      # (continue-on-error 스텝의 실패는 job 실패가 아니라서 여기 안 걸린다 — 의도)
      - name: Notify failure (Telegram)
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          MSG="[Mir Actions 실패] ${{ github.workflow }} ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" >/dev/null
