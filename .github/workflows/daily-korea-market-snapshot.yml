name: Daily Korea market snapshot

on:
  # Primary path: korea-close-briefing.yml runs this script at 15:42 KST.
  # Keep manual trigger for recovery when the afternoon schedule is missed.
  #
  # 2026-08-06 백업 경로: KR 데이터 전체가 15:42 KST 단일 실행(korea-close-briefing)에
  # 매달려 있어, 그 한 번이 실패하면 그날 KR 스냅샷이 통째로 빈다(단일 장애점).
  # 22:00 KST 평일에 한 번 더 깨워 보되, 본선이 이미 오늘(KST) 스냅샷을 발행했으면
  # 아래 신선도 가드가 모든 스텝을 스킵하고 성공으로 끝낸다 — 평상시엔 아무 일도
  # 하지 않는 보험용 스케줄이다.
  schedule:
    - cron: "0 13 * * 1-5" # 22:00 KST 평일 (백업 전용 — 신선하면 no-op)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mir-publish-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # 실측 45분~2시간45분(2026-08-31 이력 확장 시)이라 120 은 위험
    steps:
      - uses: actions/checkout@v4
        with:
          # 얕은 체크아웃으로 충분하다 — 빌더의 fetch → pull --rebase → push 는 depth 1
          # 에서도 동작하고, 2.5GB 짜리 .git pack 을 run 마다 받지 않는다.
          fetch-depth: 1

      # 신선도 가드 — 백업 스케줄(22:00 KST) 전용. 본선(korea-close-briefing,
      # 15:42 KST)이 이미 오늘 KST 날짜의 스냅샷을 발행했으면 fresh=true 를 내고
      # 이후 스텝을 전부 스킵한다(중복 수집·중복 커밋 방지, run 은 성공으로 끝남).
      # 판정 키는 scripts/check_data_freshness.py 의 TIMESTAMP_KEYS 1순위와 같은
      # updatedAtKst("YYYY-MM-DD HH:MM KST"). 수동 실행(workflow_dispatch)은 복구
      # 용도이므로 가드를 적용하지 않고 항상 돌린다.
      - name: Freshness guard (skip if snapshot already today)
        id: guard
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "manual/other trigger - guard bypassed"
            exit 0
          fi
          TODAY=$(TZ=Asia/Seoul date +%F)
          SNAP=$(python3 -c "import json; print(json.load(open('data/korea/market_snapshot.json', encoding='utf-8')).get('updatedAtKst', '')[:10])" 2>/dev/null || echo "")
          echo "snapshot date: '${SNAP}' / today KST: '${TODAY}'"
          if [ -n "$SNAP" ] && [ "$SNAP" = "$TODAY" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            echo "snapshot already fresh - backup run is a no-op"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "snapshot stale or missing - backup run proceeds"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.fresh != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-actions.txt

      - name: Install dependencies
        if: steps.guard.outputs.fresh != 'true'
        run: pip install -r scripts/requirements-actions.txt

      - name: Configure git
        if: steps.guard.outputs.fresh != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update Korea market snapshot
        # KRX_ID/KRX_PW: update_korea_data 가 서브프로세스로 부르는
        # build_kr_short_interest.py 가 pykrx 로 KRX 로그인해 공매도 잔고를 받는다.
        # 없으면 그 빌더만 0건으로 조용히 끝나고 스냅샷은 정상 진행.
        # DART_API_KEY: 서브프로세스 build_kr_corp_disclosures.py(배당·수주)가 쓴다.
        if: steps.guard.outputs.fresh != 'true'
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/update_korea_data.py --push

      # 종목별 수급(외국인·기관·개인) + 컨센서스 목표주가. 스냅샷 뒤에 돌린다 —
      # 종목 목록을 market_snapshot.json 에서 읽으므로 그게 먼저 갱신돼야 한다.
      # 종목당 2콜 · 초당 8회로 약 11분. 실패해도 스냅샷은 이미 커밋됐다.
      - name: Build KR investor flow + consensus
        if: steps.guard.outputs.fresh != 'true'
        continue-on-error: true
        run: python scripts/build_kr_investor_flow.py --push
      # 실패 시 텔레그램 통지 — 신선도 감시가 워크플로우를 빨갛게 만들어도
      # Actions 탭을 안 보면 모른다. 마지막 관문의 알림 루프를 여기서 닫는다.
      # (continue-on-error 스텝의 실패는 job 실패가 아니라서 여기 안 걸린다 — 의도)
      - name: Notify failure (Telegram)
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          MSG="[Mir Actions 실패] ${{ github.workflow }} ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" >/dev/null
