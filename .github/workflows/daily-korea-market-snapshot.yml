name: Daily Korea market snapshot

on:
  # Primary path: korea-close-briefing.yml runs this script at 15:42 KST.
  # Keep manual trigger for recovery when the afternoon schedule is missed.
  #
  # 2026-08-06 백업 경로: KR 데이터 전체가 15:42 KST 단일 실행(korea-close-briefing)에
  # 매달려 있어, 그 한 번이 실패하면 그날 KR 스냅샷이 통째로 빈다(단일 장애점).
  # 22:00 KST 평일에 한 번 더 깨워 보되, 본선이 이미 오늘(KST) 스냅샷·수급·증시자금·시장 폭을
  # 모두 발행했으면 아래 신선도 가드가 모든 스텝을 스킵하고 성공으로 끝낸다 — 평상시엔 아무 일도
  # 하지 않는 보험용 스케줄이다. 일부만 실패한 날은 그것만 다시 돈다(2026-10-23, kr_backup_plan.py).
  # 정시 실행: Cloudflare 워커 mir-cron 이 아래 시각(UTC cron)에 workflow_dispatch 로 깨운다.
  # GitHub `schedule:` 은 5~8시간 늦게 출발해 2026-10-01 에 옮겼다 — DEPLOY.md "정시 실행 워커".
  # 시각을 바꾸면 `node scripts/sync_cron_worker.mjs` 로 .github/mir-cron.json 을 다시 만든다.
  # mir-cron: "0 13 * * 1-5" # 22:00 KST 평일 (백업 전용 — 신선하면 no-op)
  workflow_dispatch:
    inputs:
      cron:
        description: "예약 슬롯(UTC cron) — Cloudflare 워커 mir-cron 이 넣는다(신선도 가드 적용). 손으로 돌릴 땐 비워 둔다(가드 없이 항상 실행)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: mir-publish-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # 실측 45분~2시간45분(2026-08-31 이력 확장 시)이라 120 은 위험
    steps:
      - uses: actions/checkout@v5
        with:
          # 얕은 체크아웃으로 충분하다 — 빌더의 fetch → pull --rebase → push 는 depth 1
          # 에서도 동작하고, 2.5GB 짜리 .git pack 을 run 마다 받지 않는다.
          fetch-depth: 1

      # 신선도 가드 — 백업 스케줄(22:00 KST) 전용. 데이터셋(스냅샷·종목 수급·증시자금·시장 폭)마다 자기
      # updatedAtKst 가 오늘(KST)인지 보고 아닌 것만 다시 돈다(scripts/kr_backup_plan.py). 2026-10-23 전엔
      # 스냅샷 날짜 하나만 봐서, 본선에서 스냅샷은 성공하고 수급·증시자금만 실패한 날에도 백업이 전부 건너뛰었다.
      # 전부 오늘 것이면 any=false 로 모든 스텝을 스킵하고 성공으로 끝난다. 수동 실행은 복구 용도라 가드 없이 전부.
      - name: Freshness guard (per-dataset)
        id: guard
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ -n "${{ inputs.cron }}" ]; then
            python3 scripts/kr_backup_plan.py --guarded
          else
            python3 scripts/kr_backup_plan.py
          fi

      - uses: actions/setup-python@v6
        if: steps.guard.outputs.any == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-actions.txt

      - name: Install dependencies
        if: steps.guard.outputs.any == 'true'
        run: pip install -r scripts/requirements-actions.txt

      - name: Configure git
        if: steps.guard.outputs.any == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 주 경로(korea-close-briefing)와 같은 세 빌더 — 산출물을 쓰기만 하고 push 하지 않으므로 반드시 스냅샷
      # 업데이트(--push, data/ 전체 커밋)보다 먼저(뒤에 두면 미커밋 변경이 남는다). 백업 경로로 도는 날에도
      # 매크로·조달·수출입이 멈추지 않게(2026-09-15 감사 P2).
      - name: Build KR macro (ECOS)
        if: steps.guard.outputs.snapshot == 'true'
        continue-on-error: true
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python scripts/build_kr_ecos_macro.py

      - name: Build KR gov contracts (나라장터)
        if: steps.guard.outputs.snapshot == 'true'
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/build_kr_gov_contracts.py

      - name: Build KR trade exports (관세청)
        if: steps.guard.outputs.snapshot == 'true'
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/build_kr_trade_exports.py

      - name: Update Korea market snapshot
        # KRX_ID/KRX_PW: update_korea_data 가 서브프로세스로 부르는
        # build_kr_short_interest.py 가 pykrx 로 KRX 로그인해 공매도 잔고를 받는다.
        # 없으면 그 빌더만 0건으로 조용히 끝나고 스냅샷은 정상 진행.
        # DART_API_KEY: 서브프로세스 build_kr_corp_disclosures.py(배당·수주)가 쓴다.
        if: steps.guard.outputs.snapshot == 'true'
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/update_korea_data.py --push

      # 종목별 수급(외국인·기관·개인) + 컨센서스 목표주가. 스냅샷 뒤에 돌린다 —
      # 종목 목록을 market_snapshot.json 에서 읽으므로 그게 먼저 갱신돼야 한다.
      # 종목당 2콜 · 초당 8회로 약 11분. 실패해도 스냅샷은 이미 커밋됐다.
      - name: Build KR investor flow + consensus
        if: steps.guard.outputs.flow == 'true'
        continue-on-error: true
        run: python scripts/build_kr_investor_flow.py --push

      # 시장 폭 추이 — 방금 발행된 국내 종목 일봉만 다시 읽는다(외부 호출 없음, ~1분). 실패해도 스냅샷은 이미 커밋됐다.
      - name: Build market breadth (KR)
        if: steps.guard.outputs.breadth == 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/build_market_breadth.py --market kr --push

      # 증시자금·시장 투자자별·순매수 상위(korea-close-briefing 과 같은 스텝, 백업 경로).
      - name: Build KR market funds
        if: steps.guard.outputs.funds == 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/build_kr_market_funds.py --push

      # 마지막 관문 — 백업 경로로 돈 날도 주 경로와 같은 KR 신선도 검사를 한다(2026-09-15 감사 P2: 백업엔 관문이 없어
      # 이 경로로 돈 날의 이상을 아무도 몰랐다).
      - name: Check data freshness (KR)
        if: steps.guard.outputs.any == 'true'
        run: python scripts/check_data_freshness.py --group kr
      # 실패 시 텔레그램 통지 — 신선도 감시가 워크플로우를 빨갛게 만들어도
      # Actions 탭을 안 보면 모른다. 마지막 관문의 알림 루프를 여기서 닫는다.
      # (continue-on-error 스텝의 실패는 job 실패가 아니라서 여기 안 걸린다 — 의도)
      - name: Notify failure (Telegram)
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          MSG="[Mir Actions 실패] ${{ github.workflow }} ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" >/dev/null
