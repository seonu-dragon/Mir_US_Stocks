name: Daily Korea News Top 5

on:
  schedule:
    # 19:43 UTC = 04:43 KST on the following day.
    - cron: "43 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mir-publish-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  collect-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect 50 articles and create Gemini Top 5
        run: python SNS/Naver/automation/daily_news_pipeline.py --max-articles 50

      - name: Commit daily results
        shell: bash
        run: |
          DATE_KST=$(TZ=Asia/Seoul date +%F)
          DAILY_DIR="SNS/Naver/02_daily_work/${DATE_KST}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "${DAILY_DIR}/01_input/news_collection.json"
          git add "${DAILY_DIR}/01_input/news_collection.md"
          git add "${DAILY_DIR}/02_analysis/01_gemini_phase1.md"
          git add "${DAILY_DIR}/status/01_collection.done"
          git add "${DAILY_DIR}/status/02_gemini.done"
          if git diff --cached --quiet; then
            echo "No new daily results to commit."
            exit 0
          fi
          git commit -m "chore: add ${DATE_KST} Korea news Top 5"
          # 워크플로우별 concurrency 그룹 분리 후에는 다른 데이터 워크플로우와
          # push 가 경합할 수 있다. 이 잡의 커밋은 날짜 폴더의 신규 파일뿐이라
          # rebase 충돌은 사실상 없고, 재시도만 있으면 된다.
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push attempt ${attempt} failed; retrying in 10s"
            sleep 10
          done
          exit 1
      # 실패 시 텔레그램 통지 — 신선도 감시가 워크플로우를 빨갛게 만들어도
      # Actions 탭을 안 보면 모른다. 마지막 관문의 알림 루프를 여기서 닫는다.
      # (continue-on-error 스텝의 실패는 job 실패가 아니라서 여기 안 걸린다 — 의도)
      - name: Notify failure (Telegram)
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          MSG="[Mir Actions 실패] ${{ github.workflow }} ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" >/dev/null
