name: Daily US market snapshot

on:
  schedule:
    - cron: "5 20 * * *"  # 05:05 KST (UTC+9) — US market close snapshot
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mir-publish-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-actions.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-actions.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 야후가 못 채우는 peg·pfcf·evEbitda·divYield 를 Finnhub 로 보강한다.
      # update_data 보다 먼저 돌려야 한다 — 그 안에서 build_map_fundamentals 가
      # 이 파일을 읽어 병합하므로, 나중에 돌리면 하루 묵은 값이 병합된다.
      # 무료 티어 레이트리밋(초당 1회) 때문에 1,000종목에 약 18분 걸린다.
      # 실패해도 스냅샷 갱신은 계속한다 — 키가 없거나 API 가 죽어도 기존 값이 남는다.
      - name: Refresh Finnhub valuation metrics (US)
        continue-on-error: true
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/build_us_finnhub_metrics.py --push

      # FRED 국채 수익률 곡선(키 불필요). 실패해도 스냅샷 갱신은 계속한다.
      # 파일만 쓰고, 아래 update_data 의 git add data/ 가 함께 커밋·배포한다.
      - name: Build US Treasury yield curve (FRED)
        continue-on-error: true
        run: python scripts/build_yield_curve.py

      # FRED 매크로 지표(인플레·고용·금리·신용스프레드·소비심리). 키 불필요.
      - name: Build macro indicators (FRED)
        continue-on-error: true
        run: python scripts/build_macro_indicators.py

      # FINRA 일일 공매도 거래량(무료). 격주 공매도잔고 보완.
      - name: Build FINRA daily short volume
        continue-on-error: true
        run: python scripts/build_finra_short_volume.py

      # 옵션 심리(풋콜·맥스페인, Yahoo 크럼). 실패해도 스냅샷 갱신 계속.
      - name: Build US options stats (Yahoo)
        continue-on-error: true
        run: python scripts/build_options_stats.py --top 80

      # 배당 + 다음 실적 예정일(Yahoo). 실패해도 계속.
      - name: Build US dividends & earnings calendar (Yahoo)
        continue-on-error: true
        run: python scripts/build_us_dividends_calendar.py --top 200

      # 연방 계약(USASpending, 무료). 정부계약사 12개월 집행액. 실패해도 계속.
      - name: Build US federal contracts (USASpending)
        continue-on-error: true
        run: python scripts/build_federal_contracts.py

      # 무키 공공 피드 3종(2026-08-06 추가). 전부 '기존 파일 유지 후 exit 1' 규약이라
      # continue-on-error 로 넘기고, 신선도 감시가 마지막 관문으로 잡는다.
      - name: Build CFTC COT positioning
        continue-on-error: true
        run: python scripts/build_cftc_cot.py

      - name: Build US Treasury auction demand (FiscalData)
        continue-on-error: true
        run: python scripts/build_treasury_auctions.py

      - name: Build SEC fails-to-deliver
        continue-on-error: true
        run: python scripts/build_sec_ftd.py

      # 애널리스트 컨센서스(Finnhub 추천·서프라이즈). 무료 티어, 미국만. 실패해도 계속.
      - name: Build US analyst consensus (Finnhub)
        continue-on-error: true
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/build_us_analyst_consensus.py --top 200

      - name: Update US market snapshot
        run: python scripts/update_data.py --push

      # 공포탐욕·환율·매크로 일일 히스토리 적립(스파크라인용 시계열).
      # 방금 갱신된 스냅샷·매크로 파일에서 오늘 레코드 1개를 계산해 쌓는다.
      # 히스토리 실패가 스냅샷 발행을 막으면 안 되므로 continue-on-error.
      - name: Append market history (fear/greed - macro)
        continue-on-error: true
        run: python scripts/build_market_history.py --push

      # 마지막 관문: 위 스텝들은 소스가 죽어도 "기존 파일 유지" 후
      # continue-on-error 로 넘어가므로 영원히 초록일 수 있다. 산출물의
      # 타임스탬프가 허용 나이를 넘으면 여기서 워크플로우를 빨갛게 만든다.
      - name: Check data freshness (US)
        run: python scripts/check_data_freshness.py --group us
      # 실패 시 텔레그램 통지 — 신선도 감시가 워크플로우를 빨갛게 만들어도
      # Actions 탭을 안 보면 모른다. 마지막 관문의 알림 루프를 여기서 닫는다.
      # (continue-on-error 스텝의 실패는 job 실패가 아니라서 여기 안 걸린다 — 의도)
      - name: Notify failure (Telegram)
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          MSG="[Mir Actions 실패] ${{ github.workflow }} ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" >/dev/null
