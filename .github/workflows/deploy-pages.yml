name: Deploy Pages

# 정적 사이트(HTML/JS/CSS + data/)를 GitHub Actions로 직접 배포한다.
# legacy(브랜치 Jekyll) 자동 배포는 push가 몰릴 때 배포끼리 경합해
# "Deployment failed, try again later" (syncing_files) transient 실패를 냈다.
# concurrency 그룹으로 배포를 직렬화해 그 경합을 없앤다.

# 데이터 워크플로우는 actions/checkout 의 기본 GITHUB_TOKEN 으로 푸시하는데,
# GITHUB_TOKEN 이 만든 push 이벤트는 워크플로우를 트리거하지 않는다(재귀 실행
# 방지). 그래서 아래 push 트리거는 사람이 푸시할 때만 걸린다. 자동 데이터
# 갱신을 사이트에 반영하려면 각 워크플로우의 완료를 workflow_run 으로 받아야
# 한다 — 이 목록이 비면 데이터가 레포에만 쌓이고 사이트는 멈춘다.
# 데이터 워크플로우를 새로 추가하면 여기에도 그 name: 을 넣을 것.
# (SNS/ 처럼 아래 rsync 제외 경로에만 커밋하는 워크플로우는 넣지 않는다 —
# "Daily Korea News Top 5" 가 그 예. scripts/check_deploy_triggers.py 의
# NOT_DATA_WORKFLOWS 와 짝이다.)
on:
  push:
    branches: [main]
  workflow_run:
    types: [completed]
    workflows:
      - "Institutional 13F quarterly refresh"
      - "Activist stakes (SEC 13D/G)"
      - "Congress trades refresh"
      - "Daily earnings calendar"
      - "Daily Korea market snapshot"
      - "Daily US market snapshot"
      - "Insider trades (SEC Form 4)"
      - "IPO calendar (SEC S-1/424B4)"
      - "Korea close briefing"
      - "Korea premarket briefing"
      - "KR DART disclosures + ownership"
      - "Material events (SEC 8-K)"
      - "Short interest (Nasdaq/FINRA)"
      - "US close briefing"
      - "US premarket briefing"
      - "Weekly earnings history refresh"
      - "Weekly edge stats (S/R · breakout)"
      - "White House schedule refresh"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 끊지 않고(false), 대기열의
# 중간 실행들은 GitHub가 자동으로 정리해 최신 것만 남긴다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # cancelled 로 끝난 run(같은 워크플로우의 대기 교체 등)까지 배포를 돌리면
    # 아티팩트 수백 MB 업로드만 낭비된다. 부분 push 를 놓칠 수 있는 failure 는
    # 배포한다(success 만 거르면 안 됨).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 같은 내용을 여러 번 올리지 않는다. 데이터 워크플로우가 각각 완료마다 배포를
      # 트리거하는데, 그중 다수는 앞선 배포가 이미 올린 커밋을 다시 올리거나 서빙하지
      # 않는 경로만 바꾼다(아티팩트 ~330MB 업로드 낭비 + 큐 점유). 마지막 성공 배포의
      # 커밋과 지금 커밋 사이에 서빙 경로 변경이 없으면 건너뛴다.
      # 비교 대상은 workflow_run.head_sha 가 아니라 github.sha 다 — head_sha 는 데이터
      # 워크플로우가 체크아웃한 커밋(= 그 run 이 push 하기 *전*)이라 그걸로 비교하면
      # 방금 push 된 데이터가 항상 "변경 없음" 으로 보인다. workflow_run 이벤트의
      # github.sha 는 기본 브랜치의 최신 커밋(= 체크아웃된 HEAD)이다.
      # 제외 목록은 아래 rsync --exclude 및 rm -f 와 같아야 한다.
      - name: Skip when nothing site-affecting changed since the last deploy
        id: gate
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CUR="${{ github.sha }}"
          LAST="$(gh run list --workflow deploy-pages.yml --status success --limit 1 --json headSha --jq '.[0].headSha // empty' 2>/dev/null || true)"
          if [ -z "$LAST" ]; then
            echo "no previous successful deploy — deploying"
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$LAST" = "$CUR" ]; then
            echo "commit $CUR is already deployed — skipping"
            echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! git fetch --quiet --depth=1 origin "$LAST"; then
            echo "cannot fetch last deployed commit $LAST — deploying"
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --quiet "$LAST" "$CUR" -- . \
               ':(exclude).github' ':(exclude).claude' ':(exclude)SNS' ':(exclude)mir_design' \
               ':(exclude)scratch' ':(exclude)scripts' ':(exclude)automation' ':(exclude)worker' \
               ':(exclude)prompts' ':(exclude)terminals' ':(exclude)mcps' ':(exclude)agent-tools' \
               ':(exclude)outputs' ':(exclude)data/export' ':(exclude)data/참고' \
               ':(exclude)README.md' ':(exclude)CLAUDE.md' ':(exclude)DEPLOY.md' \
               ':(exclude)AI_MODE_VISION.md' ':(exclude)FEATURES.md' \
               ':(exclude)data/market_snapshot.js' ':(exclude)data/korea/market_snapshot.js' \
               ':(exclude)data/insider_trades.json' ':(exclude)data/congress_trades.json' \
               ':(exclude)data/institutional_13f.json' \
               ':(exclude)data/korea/earnings.js' ':(exclude)data/korea/earnings.json' \
               ':(exclude)data/korea/indicators.js' ':(exclude)data/korea/indicators.json' \
               ':(exclude)data/korea/financials_history.json' ':(exclude)data/korea/krx_metrics.json' \
               ':(exclude)data/us_financials_history.json'; then
            echo "no site-affecting change between $LAST and $CUR — skipping"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "site-affecting change since $LAST — deploying"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        if: steps.gate.outputs.deploy != 'false'
        uses: actions/configure-pages@v5

      # 사이트가 서빙하지 않는 파일을 아티팩트에서 덜어낸다(2026-09-03 기준 아티팩트
      # ≈330MB; 2026-08-06 실측 땐 추적 424MB 중 ~350MB). 예전엔 체크아웃에서 rm 으로 지운 뒤 path: '.'
      # 를 올렸는데, 2026-08-06 부터 rsync 로 _site/ 스테이징 사본을 만들어 올린다 —
      # 체크아웃이 온전히 남아 이후 스텝이 레포 파일을 참조해도 안전하고, 실수로
      # 제외를 빼먹으면 배포가 커질 뿐 체크아웃을 파괴하는 사고가 없다.
      # 제외 대상은 빌드 전용(스크립트·워크플로우·디자인 원본·SNS 산출물·문서)뿐이다.
      # 루트 *.html/*.js/*.css, manifest.webmanifest, sw.js, build_id.js, sitemap.xml,
      # robots.txt, assets/, data/ 는 반드시 남는다.
      # 주의: data/ 의 .js/.json 쌍은 파일마다 브라우저가 읽는 쪽이 다르다.
      #  - market_snapshot 은 브라우저가 .json 을 fetch (.js 는 file:// 폴백 전용)
      #  - insider/congress/13f 는 브라우저가 .js 를 로드 (.json 은 증분 빌더 상태)
      #  - korea/earnings·indicators 는 브라우저 소비자가 없다(빌더 입력 전용)
      # 목록을 바꾸기 전에 app.js 의 FEATURE_DATA / fetch 경로를 확인할 것.
      - name: Stage site artifact (exclude build-only files)
        if: steps.gate.outputs.deploy != 'false'
        run: |
          rsync -a \
            --exclude='_site' \
            --exclude='.git' --exclude='.github' --exclude='.claude' \
            --exclude='__pycache__' \
            --exclude='/SNS' --exclude='/mir_design' --exclude='/scratch' \
            --exclude='/scripts' --exclude='/automation' --exclude='/worker' \
            --exclude='/prompts' --exclude='/terminals' --exclude='/mcps' \
            --exclude='/agent-tools' --exclude='/outputs' \
            --exclude='/data/export' --exclude='/data/참고' \
            --exclude='/README.md' --exclude='/CLAUDE.md' --exclude='/DEPLOY.md' \
            --exclude='/AI_MODE_VISION.md' --exclude='/FEATURES.md' \
            ./ _site/
          rm -f  _site/data/market_snapshot.js _site/data/korea/market_snapshot.js \
                 _site/data/insider_trades.json _site/data/congress_trades.json \
                 _site/data/institutional_13f.json \
                 _site/data/korea/earnings.js _site/data/korea/earnings.json \
                 _site/data/korea/indicators.js _site/data/korea/indicators.json \
                 _site/data/korea/financials_history.json _site/data/korea/krx_metrics.json \
                 _site/data/us_financials_history.json
          echo "artifact size:" && du -sh _site | cut -f1

      - name: Upload site artifact
        if: steps.gate.outputs.deploy != 'false'
        uses: actions/upload-pages-artifact@v3
        with:
          # 스테이징 사본 = 서빙 내용. 체크아웃 루트가 아니라 _site 만 올린다.
          path: '_site'

      - name: Deploy to GitHub Pages
        if: steps.gate.outputs.deploy != 'false'
        id: deployment
        uses: actions/deploy-pages@v4
      # 실패 시 텔레그램 통지 — 신선도 감시가 워크플로우를 빨갛게 만들어도
      # Actions 탭을 안 보면 모른다. 마지막 관문의 알림 루프를 여기서 닫는다.
      # (continue-on-error 스텝의 실패는 job 실패가 아니라서 여기 안 걸린다 — 의도)
      - name: Notify failure (Telegram)
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          MSG="[Mir Actions 실패] ${{ github.workflow }} ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" >/dev/null
