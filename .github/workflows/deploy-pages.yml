name: Deploy Pages

# 정적 사이트(HTML/JS/CSS + data/)를 GitHub Actions로 직접 배포한다.
# legacy(브랜치 Jekyll) 자동 배포는 push가 몰릴 때 배포끼리 경합해
# "Deployment failed, try again later" (syncing_files) transient 실패를 냈다.
# concurrency 그룹으로 배포를 직렬화해 그 경합을 없앤다.

# 데이터 워크플로우는 actions/checkout 의 기본 GITHUB_TOKEN 으로 푸시하는데,
# GITHUB_TOKEN 이 만든 push 이벤트는 워크플로우를 트리거하지 않는다(재귀 실행
# 방지). 그래서 아래 push 트리거는 사람이 푸시할 때만 걸린다. 자동 데이터
# 갱신을 사이트에 반영하려면 각 워크플로우의 완료를 workflow_run 으로 받아야
# 한다 — 이 목록이 비면 데이터가 레포에만 쌓이고 사이트는 멈춘다.
# 데이터 워크플로우를 새로 추가하면 여기에도 그 name: 을 넣을 것.
# (SNS/ 처럼 아래 rsync 제외 경로에만 커밋하는 워크플로우는 넣지 않는다 —
# "Daily Korea News Top 5" 가 그 예. scripts/check_deploy_triggers.py 의
# NOT_DATA_WORKFLOWS 와 짝이다.)
on:
  push:
    branches: [main]
  workflow_run:
    types: [completed]
    workflows:
      - "Institutional 13F quarterly refresh"
      - "Activist stakes (SEC 13D/G)"
      - "Congress trades refresh"
      - "Daily earnings calendar"
      - "Daily Korea market snapshot"
      - "Daily US market snapshot"
      - "Insider trades (SEC Form 4)"
      - "IPO calendar (SEC S-1/424B4)"
      - "Korea close briefing"
      - "Korea premarket briefing"
      - "KR DART disclosures + ownership"
      - "Material events (SEC 8-K)"
      - "Moment news (daily)"
      - "Short interest (Nasdaq/FINRA)"
      - "US close briefing"
      - "US premarket briefing"
      - "Weekly earnings history refresh"
      - "Weekly edge stats (S/R · breakout)"
      - "White House schedule refresh"
      - "Industry indicators"
      - "Macro odds (prediction markets)"
      - "KR valuation band (PER/PBR)"
      - "Event study (weekly)"
      - "Crisis history (stress replay)"
      - "Screener backtest panel"
      - "Market indicators"
      - "Company profile & price targets"
      - "Market calendar + ETF holdings"
      - "Data health watch"
  workflow_dispatch:
    inputs:
      # R2 details 동기화(아래 'Sync details to R2', 리포 변수 MIR_R2_DETAILS=true 일 때만 돈다)에서
      # 레포에 없는 객체(상장폐지 등으로 빠진 종목 파일)까지 지울지. 기본은 추가·갱신만(rclone copy).
      # 첫 전체 업로드는 이 입력 없이 Run workflow 한 번이면 된다 — copy 가 체크섬으로 빠진 것만 올린다.
      r2_prune:
        description: "R2 details: 레포에 없는 객체도 삭제(rclone sync, 최대 500개). 평소엔 끔."
        type: boolean
        default: false

# actions: read 는 아래 no-op 게이트의 `gh run list` 용이다. 지금은 공개 레포라
# 없어도 통하지만, 비공개로 바꾸면 조회가 조용히 실패해 "항상 배포" 로 퇴화한다.
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# 배포는 한 번에 하나만. 진행 중인 배포는 끊지 않고(false), 대기열의
# 중간 실행들은 GitHub가 자동으로 정리해 최신 것만 남긴다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # cancelled 로 끝난 run(같은 워크플로우의 대기 교체 등)까지 배포를 돌리면
    # 아티팩트 수백 MB 업로드만 낭비된다. 부분 push 를 놓칠 수 있는 failure 는
    # 배포한다(success 만 거르면 안 됨).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # push 이벤트는 main 의 *지금* 최신을 받는다. 기본값(github.sha = 푸시된 커밋)이면 늦게 도착한 push
      # 이벤트가 옛 커밋을 배포해 라이브를 되돌린다 — 2026-10-21 밤 GitHub 의 push 이벤트가 1시간 넘게 밀려
      # #353 의 push 배포(15:25Z)가 그보다 새 #354 수동 배포(15:20Z)를 덮었다. 다른 이벤트는 그대로
      # (workflow_run·workflow_dispatch 의 github.sha 는 이미 실행 시점의 브랜치 최신이다).
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && github.ref || '' }}

      # 같은 내용을 여러 번 올리지 않는다. 데이터 워크플로우가 각각 완료마다 배포를
      # 트리거하는데, 그중 다수는 앞선 배포가 이미 올린 커밋을 다시 올리거나 서빙하지
      # 않는 경로만 바꾼다(아티팩트 456MB 업로드 낭비 + 큐 점유). 마지막 성공 배포의
      # 커밋과 지금 커밋 사이에 서빙 경로 변경이 없으면 건너뛴다.
      # 비교 대상은 workflow_run.head_sha 가 아니라 github.sha 다 — head_sha 는 데이터
      # 워크플로우가 체크아웃한 커밋(= 그 run 이 push 하기 *전*)이라 그걸로 비교하면
      # 방금 push 된 데이터가 항상 "변경 없음" 으로 보인다. workflow_run 이벤트의
      # github.sha 는 기본 브랜치의 최신 커밋(= 체크아웃된 HEAD)이다.
      # 제외 목록은 아래 rsync --exclude 및 rm -f 와 같아야 한다.
      - name: Skip when nothing site-affecting changed since the last deploy
        id: gate
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CUR="${{ github.sha }}"
          # stderr 를 버리지 않는다 — 권한·레이트리밋 오류를 삼키면 "이전 배포 없음"
          # 으로 잘못 읽혀 매번 456MB 를 다시 올린다. --branch main 으로 다른 브랜치의
          # 수동 배포가 기준 커밋이 되는 것도 막는다.
          LAST="$(gh run list --workflow deploy-pages.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // empty' || true)"
          if [ -z "$LAST" ]; then
            echo "no previous successful deploy — deploying"
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$LAST" = "$CUR" ]; then
            echo "commit $CUR is already deployed — skipping"
            echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! git fetch --quiet --depth=1 origin "$LAST"; then
            echo "cannot fetch last deployed commit $LAST — deploying"
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --quiet "$LAST" "$CUR" -- . \
               ':(exclude).github' ':(exclude).claude' ':(exclude)SNS' ':(exclude)mir_design' \
               ':(exclude)scratch' ':(exclude)scripts' ':(exclude)automation' ':(exclude)worker' \
               ':(exclude)prompts' ':(exclude)terminals' ':(exclude)mcps' ':(exclude)agent-tools' \
               ':(exclude)outputs' ':(exclude)data/export' ':(exclude)data/참고' \
               ':(exclude)README.md' ':(exclude)CLAUDE.md' ':(exclude)DEPLOY.md' \
               ':(exclude)AI_MODE_VISION.md' ':(exclude)FEATURES.md' \
               ':(exclude)data/market_snapshot.js' ':(exclude)data/korea/market_snapshot.js' \
               ':(exclude)data/insider_trades.json' ':(exclude)data/congress_trades.json' \
               ':(exclude)data/institutional_13f.json' \
               ':(exclude)data/korea/earnings.js' ':(exclude)data/korea/earnings.json' \
               ':(exclude)data/korea/indicators.js' ':(exclude)data/korea/indicators.json' \
               ':(exclude)data/korea/financials_history.json' ':(exclude)data/korea/krx_metrics.json' \
               ':(exclude)data/us_financials_history.json' ':(exclude)data/industry_archive' \
               ':(exclude)data/event_study_archive' ':(exclude)data/company_profile/state.json' ':(exclude)data/logos/state.json' \
               ':(exclude)data/institutional_holders/state.json' ':(exclude)data/institutional_holders/cusip_map.json' \
               ':(exclude)data/korea/themes_state.json' ':(exclude)data/korea/target_reports_state.json' \
               ':(exclude)data/korea/cb_overhang_state.json' ':(exclude)data/korea/fin_safety_state.json' \
               ':(exclude)data/korea/consensus_history.json' ':(exclude)data/korea/major_holders_state.json' \
               ':(exclude)data/korea/stake_value_state.json' \
               ':(exclude)data/korea/valueup_state.json' ':(exclude)data/korea/earnings_dates_state.json' \n               ':(exclude)data/senate_ptr_cache.json' ':(exclude)data/health_alert_state.json'; then
            echo "no site-affecting change between $LAST and $CUR — skipping"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "site-affecting change since $LAST — deploying"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        if: steps.gate.outputs.deploy != 'false'
        uses: actions/configure-pages@v6

      # ── 종목 상세를 Cloudflare R2 로(기능 플래그, 기본 꺼짐) ─────────────────────────────
      # data/details·data/korea/details 가 아티팩트의 80%다(CLAUDE.md '알려진 부채'). 리포 변수
      # MIR_R2_DETAILS 가 'true' 이고 시크릿 4개(R2_ACCOUNT_ID·R2_ACCESS_KEY_ID·R2_SECRET_ACCESS_KEY·
      # R2_BUCKET)가 다 있을 때만, 체크아웃의 두 폴더를 버킷의 **같은 경로**(data/details/<T>.json …)로
      # 올린다. 변수가 없으면 이 스텝은 아예 돌지 않고, 배포는 지금과 똑같다.
      # 데이터 워크플로우마다 넣지 않고 여기 한 곳에서 하는 이유: details 를 커밋하는 건 일일 스냅샷
      # US·KR(update_data.py / update_korea_data.py 의 `git add data/`)인데, 그 완료가 전부 이 배포로
      # 모이고 위 게이트가 '서빙 경로 변경 없음'을 이미 걸러 준다.
      # rclone copy --checksum: 크기+MD5(ETag) 비교라 체크아웃 mtime 과 무관하게 바뀐 파일만 올린다.
      # 실패해도 배포는 계속하고(continue-on-error) ok 출력이 안 나가므로, 아래 스테이징은 details 를
      # 그대로 Pages 에 싣는다(폴백). 첫 업로드가 시간 제한에 걸려도 다음 배포가 이어서 올린다.
      - name: Sync details to R2 (flag vars.MIR_R2_DETAILS)
        id: r2
        if: steps.gate.outputs.deploy != 'false' && vars.MIR_R2_DETAILS == 'true'
        continue-on-error: true
        timeout-minutes: 8
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PRUNE: ${{ inputs.r2_prune && 'true' || 'false' }}
          RCLONE_VERSION: "v1.68.2"
        shell: bash
        run: |
          set -euo pipefail
          missing=""
          for v in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            [ -n "${!v:-}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::MIR_R2_DETAILS=true 인데 시크릿이 없습니다:${missing} — R2 동기화를 건너뛰고 details 는 Pages 에 그대로 싣습니다."
            exit 0
          fi
          # rclone 고정 버전 + 공식 SHA256SUMS 검증(러너에 기본 설치돼 있지 않다).
          tmp="$(mktemp -d)"
          zip="rclone-${RCLONE_VERSION}-linux-amd64.zip"
          curl -fsSL --retry 3 -o "$tmp/$zip" "https://downloads.rclone.org/${RCLONE_VERSION}/${zip}"
          curl -fsSL --retry 3 -o "$tmp/SHA256SUMS" "https://downloads.rclone.org/${RCLONE_VERSION}/SHA256SUMS"
          (cd "$tmp" && grep " ${zip}\$" SHA256SUMS | sha256sum -c -)
          unzip -q -j "$tmp/$zip" '*/rclone' -d "$tmp/bin"
          RCLONE="$tmp/bin/rclone"
          "$RCLONE" version | head -1
          # 설정 파일 없이 환경변수로 원격 'r2' 를 정의한다(S3 호환 API).
          # no_check_bucket: 버킷 한정 Object Read & Write 토큰은 버킷 생성·조회 권한이 없다.
          export RCLONE_CONFIG_R2_TYPE=s3
          export RCLONE_CONFIG_R2_PROVIDER=Cloudflare
          export RCLONE_CONFIG_R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export RCLONE_CONFIG_R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          export RCLONE_CONFIG_R2_REGION=auto
          export RCLONE_CONFIG_R2_NO_CHECK_BUCKET=true
          mode=copy; extra=()
          if [ "$R2_PRUNE" = "true" ]; then mode=sync; extra=(--max-delete 500); fi
          for dir in data/details data/korea/details; do
            n="$(find "$dir" -maxdepth 1 -name '*.json' | wc -l)"
            echo "== ${mode} ${dir} (${n} files) -> r2:${R2_BUCKET}/${dir}"
            # Cache-Control 은 짧게: 같은 경로가 하루 여러 번 바뀐다(프론트는 no-cache 로 재검증한다).
            "$RCLONE" "$mode" "$dir" "r2:${R2_BUCKET}/${dir}" \
              --checksum --fast-list --include '*.json' \
              --transfers 32 --checkers 32 --retries 3 --low-level-retries 10 \
              --header-upload "Content-Type: application/json; charset=utf-8" \
              --header-upload "Cache-Control: public, max-age=60" \
              --stats 30s --stats-one-line "${extra[@]}"
          done
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "- R2 details 동기화: 성공(${mode})" >> "$GITHUB_STEP_SUMMARY"

      # R2 동기화 실패는 continue-on-error 라 맨 아래 Notify failure 에 안 걸린다 — 여기서 따로 알린다.
      - name: Notify R2 sync failure (Telegram)
        if: steps.r2.outcome == 'failure'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          echo "::warning::R2 details 동기화 실패 — 이번 배포는 details 를 Pages 에 그대로 싣습니다(폴백)."
          echo "- R2 details 동기화: **실패** → details 는 Pages 에 포함(폴백)" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          MSG="[Mir R2] details 동기화 실패(배포는 Pages 폴백으로 계속) ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" >/dev/null

      # 사이트가 서빙하지 않는 파일을 아티팩트에서 덜어낸다(2026-09-15 실측 아티팩트
      # 456MB; 2026-08-06 실측 땐 추적 424MB 중 ~350MB). 예전엔 체크아웃에서 rm 으로 지운 뒤 path: '.'
      # 를 올렸는데, 2026-08-06 부터 rsync 로 _site/ 스테이징 사본을 만들어 올린다 —
      # 체크아웃이 온전히 남아 이후 스텝이 레포 파일을 참조해도 안전하고, 실수로
      # 제외를 빼먹으면 배포가 커질 뿐 체크아웃을 파괴하는 사고가 없다.
      # 제외 대상은 빌드 전용(스크립트·워크플로우·디자인 원본·SNS 산출물·문서)뿐이다.
      # 루트 *.html/*.js/*.css, manifest.webmanifest, sw.js, build_id.js, sitemap.xml,
      # robots.txt, assets/, data/ 는 반드시 남는다.
      # 주의: data/ 의 .js/.json 쌍은 파일마다 브라우저가 읽는 쪽이 다르다.
      #  - market_snapshot 은 브라우저가 .json 을 fetch (.js 는 file:// 폴백 전용)
      #  - insider/congress/13f 는 브라우저가 .js 를 로드 (.json 은 증분 빌더 상태)
      #  - korea/earnings·indicators 는 브라우저 소비자가 없다(빌더 입력 전용)
      # 목록을 바꾸기 전에 app.js 의 FEATURE_DATA / fetch 경로를 확인할 것.
      - name: Stage site artifact (exclude build-only files)
        if: steps.gate.outputs.deploy != 'false'
        env:
          # 셋 다 맞아야 details 를 아티팩트에서 뺀다(DEPLOY.md 'R2 종목 상세' 3단계):
          #  ① 이번 run 의 R2 동기화 성공(steps.r2.outputs.ok — 실패·미실행이면 빈 값)
          #  ② 리포 변수 MIR_R2_DETAILS_SKIP_PAGES == 'true'
          #  ③ details-source.js 의 detailsBase 가 https URL 로 채워져 있음(프론트가 R2 를 본다)
          # 하나라도 아니면 지금처럼 details 를 Pages 에 싣는다.
          R2_OK: ${{ steps.r2.outputs.ok }}
          R2_SKIP_PAGES: ${{ vars.MIR_R2_DETAILS_SKIP_PAGES }}
        run: |
          rsync -a \
            --exclude='_site' \
            --exclude='.git' --exclude='.github' --exclude='.claude' \
            --exclude='__pycache__' \
            --exclude='/SNS' --exclude='/mir_design' --exclude='/scratch' \
            --exclude='/scripts' --exclude='/automation' --exclude='/worker' \
            --exclude='/prompts' --exclude='/terminals' --exclude='/mcps' \
            --exclude='/agent-tools' --exclude='/outputs' \
            --exclude='/data/export' --exclude='/data/참고' --exclude='/data/industry_archive' \
            --exclude='/data/event_study_archive' \
            --exclude='/README.md' --exclude='/CLAUDE.md' --exclude='/DEPLOY.md' \
            --exclude='/AI_MODE_VISION.md' --exclude='/FEATURES.md' \
            ./ _site/
          rm -f  _site/data/market_snapshot.js _site/data/korea/market_snapshot.js \
                 _site/data/insider_trades.json _site/data/congress_trades.json \
                 _site/data/institutional_13f.json \
                 _site/data/korea/earnings.js _site/data/korea/earnings.json \
                 _site/data/korea/indicators.js _site/data/korea/indicators.json \
                 _site/data/korea/financials_history.json _site/data/korea/krx_metrics.json \
                 _site/data/us_financials_history.json \
                 _site/data/company_profile/state.json _site/data/logos/state.json \
                 _site/data/institutional_holders/state.json _site/data/institutional_holders/cusip_map.json \
                 _site/data/korea/themes_state.json _site/data/korea/target_reports_state.json \
                 _site/data/korea/cb_overhang_state.json _site/data/korea/fin_safety_state.json \
                 _site/data/korea/consensus_history.json _site/data/korea/major_holders_state.json \
                 _site/data/korea/stake_value_state.json \
                 _site/data/korea/valueup_state.json _site/data/korea/earnings_dates_state.json \n                 _site/data/senate_ptr_cache.json _site/data/health_alert_state.json
          if [ "${R2_OK:-}" = "true" ] && [ "${R2_SKIP_PAGES:-}" = "true" ]; then
            if grep -Eq '^[[:space:]]*detailsBase:[[:space:]]*"https://[^"]+"' details-source.js; then
              rm -rf _site/data/details _site/data/korea/details
              echo "R2 details: Pages 아티팩트에서 data/details·data/korea/details 제외"
              echo "- R2 details: Pages 아티팩트에서 제외" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::MIR_R2_DETAILS_SKIP_PAGES=true 인데 details-source.js 의 detailsBase 가 비어 있습니다 — details 를 Pages 에 그대로 싣습니다."
            fi
          fi
          echo "artifact size:" && du -sh _site | cut -f1

      # 시장 스냅샷 JSON 공백 제거(2026-10-21 성능). 레포 파일은 빌더가 들여쓰기로 써서 US 12.5MB 인데
      # 같은 값을 공백 없이 쓰면 6.7MB(gzip 전송 1.65→1.43MB)라 폰의 부팅 JSON.parse 도 절반이 된다.
      # 스테이징 사본만 바꾸고 값은 그대로다(다시 읽어 같은지 확인). 실패해도 원본 그대로 배포한다.
      - name: Compact snapshot JSON (staging copy)
        if: steps.gate.outputs.deploy != 'false'
        continue-on-error: true
        run: python3 scripts/compact_site_json.py --root _site data/market_snapshot.json data/korea/market_snapshot.json

      # 종목 정적 요약 페이지(2026-10-22 SEO) — sitemap.xml 이 올린 stock/<시장>/<티커>.html 을 여기서 만든다(레포에 커밋 X,
      # 시장별 상위 300 + 허브, ~5MB). 스크립트가 먼저 _site/sitemap.xml 을 분석 딥링크판으로 바꿔 두고 실제로 만든
      # 페이지만 정적 URL 로 되돌리므로, 실패해도 404 URL 이 제출되지 않는다.
      - name: Build static stock pages (staging copy)
        if: steps.gate.outputs.deploy != 'false'
        continue-on-error: true
        run: python3 scripts/gen_stock_pages.py --root _site

      # 구독 피드(.ics 캘린더 + 공시 RSS). 데이터가 여러 워크플로우에서 따로 커밋되므로 전부가
      # 합쳐지는 여기(배포 스테이징)에서 만든다 — 레포에는 커밋하지 않는다(data/feeds/ 는
      # .gitignore). 경제지표는 워커 ?calendar=1 을 한 번 부르고, 실패해도 FOMC·산업 지표로
      # 계속한다. 피드 생성 실패로 사이트 배포를 막지 않도록 continue-on-error — 실패하면
      # 이번 배포에만 피드가 빠지고 다음 배포에서 다시 만든다. 크기는 ~1MB·파일 ~107개.
      # Pages 는 확장자로 Content-Type 을 정한다: .ics → text/calendar, .xml → application/xml.
      - name: Generate subscribe feeds (.ics / RSS)
        if: steps.gate.outputs.deploy != 'false'
        continue-on-error: true
        run: python3 scripts/gen_feeds.py --root _site --out _site/data/feeds

      # 아티팩트 크기 가드. GitHub Pages 발행 사이트 권장 한도는 1GB 인데 2026-09-15
      # 실측이 456MB(data/details 195M + data/korea/details 169M)이고 종목이 늘수록
      # 같이 큰다. 조용히 한도에 닿으면 배포가 통째로 죽으므로, 700MB 를 넘으면 여기서
      # 먼저 실패시킨다(아래 Notify failure 스텝이 텔레그램으로 알린다).
      - name: Artifact size guard
        if: steps.gate.outputs.deploy != 'false'
        env:
          MAX_MB: "700"
        shell: bash
        run: |
          set -euo pipefail
          SIZE_MB="$(du -sm _site | cut -f1)"
          echo "artifact size: ${SIZE_MB} MB (limit ${MAX_MB} MB, Pages 권장 한도 1024 MB)"
          echo "- 배포 아티팩트: ${SIZE_MB} MB / 가드 ${MAX_MB} MB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE_MB" -gt "$MAX_MB" ]; then
            echo "::error::배포 아티팩트가 ${SIZE_MB}MB 로 한도 ${MAX_MB}MB 를 넘었습니다. data/details·data/korea/details 프루닝 또는 외부 스토리지(R2) 이전이 필요합니다(CLAUDE.md '알려진 부채')."
            exit 1
          fi

      # KR 지수 정합성 게이트(2026-09-16 재감사). 미국 모드 지수 띠(워커 ?indices=)와
      # 국내 모드 지수 카드(data/korea/market_snapshot.json)가 **같은 세션 가격**인데
      # 등락률이 0.2%p 이상 다르면 배포를 멈춘다(KOSDAQ 812.41 이 −1.00% vs +0.70% 로
      # 동시에 보였던 사례). 다른 세션·워커 장애·옛 워커(대시보드 수동 배포 전)는 경고만.
      - name: KR index parity gate (worker vs snapshot)
        if: steps.gate.outputs.deploy != 'false'
        run: python3 scripts/check_kr_index_parity.py

      # 배포본만 번들: _site/ 의 index/analysis/chart_capture.html 이 읽는 classic script 들을
      # 같은 순서로 이어붙여 esbuild 로 압축한 dist/<page>.bundle.js?v=<해시> 하나로 바꾼다.
      # 레포의 HTML 은 그대로(로컬은 빌드 없이 서브). 자세한 건 scripts/build_bundle.mjs 머리말.
      - name: Setup Node (bundle)
        if: steps.gate.outputs.deploy != 'false'
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Bundle page scripts (esbuild minify)
        if: steps.gate.outputs.deploy != 'false'
        run: |
          npx --yes esbuild@0.24.2 --version
          node scripts/build_bundle.mjs --root _site --apply --minify --esbuild "npx --yes esbuild@0.24.2"
          echo "artifact size (bundled):" && du -sh _site | cut -f1

      - name: Upload site artifact
        if: steps.gate.outputs.deploy != 'false'
        uses: actions/upload-pages-artifact@v5
        with:
          # 스테이징 사본 = 서빙 내용. 체크아웃 루트가 아니라 _site 만 올린다.
          path: '_site'

      - name: Deploy to GitHub Pages
        if: steps.gate.outputs.deploy != 'false'
        id: deployment
        uses: actions/deploy-pages@v5
      # 실패 시 텔레그램 통지 — 신선도 감시가 워크플로우를 빨갛게 만들어도
      # Actions 탭을 안 보면 모른다. 마지막 관문의 알림 루프를 여기서 닫는다.
      # (continue-on-error 스텝의 실패는 job 실패가 아니라서 여기 안 걸린다 — 의도)
      - name: Notify failure (Telegram)
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          MSG="[Mir Actions 실패] ${{ github.workflow }} ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" >/dev/null
