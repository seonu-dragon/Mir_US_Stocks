name: Kiwoom Content Pipeline

on:
  schedule:
    # 07:13 KST (월-금) = 22:13 UTC (일-목) — 한국/미국 종목을 한 번에 업데이트
    - cron: "13 22 * * 0-4"
  workflow_dispatch:
    inputs:
      only:
        description: "특정 시장만 실행 (비우면 한국+미국 모두)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - KR
          - US

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r automation/requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install chromium

      - name: Build Kiwoom export JSON
        run: python scripts/build_kiwoom_exports.py

      - name: Run Kiwoom pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: python automation/main.py --skip-exports ${{ github.event.inputs.only && format('--only {0}', github.event.inputs.only) || '' }}
