name: Korea close briefing

on:
  schedule:
    - cron: "42 6 * * *"  # 15:42 KST (UTC+9)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mir-publish-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-actions.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-actions.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 장마감 스냅샷(15:40) 전용 워크플로가 스케줄 누락되는 경우가 있어
      # 장마감 브리핑 job에서 함께 갱신한다. 이게 KR 스냅샷의 실제 일일 실행 경로다.
      - name: Update Korea market snapshot
        # KRX 공매도 잔고(build_kr_short_interest.py, 서브프로세스)용 로그인 자격증명.
        # DART_API_KEY: 서브프로세스 build_kr_corp_disclosures.py(배당·수주 원문 파싱)가
        # 쓴다 — 빠뜨리면 배당·수주 탭이 0건이 된다(2026-07-22 사고).
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/update_korea_data.py --push

      # 종목별 수급(외국인·기관·개인) + 컨센서스. update_korea_data.py 는 이 빌더를
      # 부르지 않고, 전용 워크플로(daily-korea-market-snapshot.yml)는 dispatch 전용이라
      # 여기 없으면 매일 갱신 경로가 아예 없다 — 2026-07-24 이후 13일간 얼어붙어
      # 신선도 게이트가 매일 실패했다. 종목 목록을 market_snapshot.json 에서 읽으므로
      # 반드시 스냅샷 갱신 뒤에 돈다(약 11분). 일시 실패는 브리핑을 막지 않는다 —
      # 5일 넘게 얼면 아래 신선도 게이트가 잡는다.
      - name: Build KR investor flow + consensus
        continue-on-error: true
        run: python scripts/build_kr_investor_flow.py --push

      # 한국은행 ECOS 매크로(2026-08-06 추가) — 시그널 탭 KR 매크로 패널.
      - name: Build KR macro (ECOS)
        continue-on-error: true
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python scripts/build_kr_ecos_macro.py

      # 나라장터 낙찰(정부수주) — 상장사 매칭분만 발행(2026-08-07 추가).
      - name: Build KR gov contracts (나라장터)
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/build_kr_gov_contracts.py

      - name: Run Korea close briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        working-directory: scripts/briefings/korea_close
        run: python main.py

      # 마지막 관문: 산출물 타임스탬프·0건 함정(예: DART 키 누락으로 배당 0건)을
      # 여기서 잡아 워크플로우를 빨갛게 만든다.
      - name: Check data freshness (KR)
        run: python scripts/check_data_freshness.py --group kr
      # 실패 시 텔레그램 통지 — 신선도 감시가 워크플로우를 빨갛게 만들어도
      # Actions 탭을 안 보면 모른다. 마지막 관문의 알림 루프를 여기서 닫는다.
      # (continue-on-error 스텝의 실패는 job 실패가 아니라서 여기 안 걸린다 — 의도)
      - name: Notify failure (Telegram)
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          MSG="[Mir Actions 실패] ${{ github.workflow }} ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" >/dev/null
