name: KR DART disclosures + ownership

on:
  schedule:
    - cron: "30 6 * * 1-5"  # 15:30 KST weekdays
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mir-publish-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # 얕은 체크아웃으로 충분하다 — 빌더의 fetch → pull --rebase → push 는 depth 1
          # 에서도 동작하고, 2.5GB 짜리 .git pack 을 run 마다 받지 않는다.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-actions.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-actions.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build KR disclosures
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/build_kr_disclosures.py --push

      # 지분 상세는 공시 목록을 다시 벌크 조회해 대상 종목을 스스로 추리므로 위 단계에
      # 의존하지 않는다. 같은 DART API 키의 분당 호출 한도를 나눠 쓰므로 한 워크플로우
      # 안에서 순차로 돌린다(동시에 돌리면 서로 429 를 유발한다).
      - name: Build KR ownership (대량보유 · 임원소유)
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/build_kr_ownership.py --push

      # 공시 제목에 숫자를 붙인다(증자 희석률·CB 전환가·자사주 금액). 위 공시 목록을
      # 읽어 해당 유형을 낸 종목만 호출하므로 200회 안팎이면 끝난다.
      - name: Build KR event details (주요사항보고서 상세)
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/build_kr_event_details.py --push
      # 위 빌더 스텝은 continue-on-error 라 소스가 영구히 죽어도 워크플로우는 초록이다.
      # 산출물의 타임스탬프 나이로 마지막 관문을 세운다(scripts/check_data_freshness.py).
      - name: Data freshness gate
        run: python scripts/check_data_freshness.py --group kr-dart
      # 실패 시 텔레그램 통지 — 신선도 감시가 워크플로우를 빨갛게 만들어도
      # Actions 탭을 안 보면 모른다. 마지막 관문의 알림 루프를 여기서 닫는다.
      # (continue-on-error 스텝의 실패는 job 실패가 아니라서 여기 안 걸린다 — 의도)
      - name: Notify failure (Telegram)
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          MSG="[Mir Actions 실패] ${{ github.workflow }} ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" >/dev/null
