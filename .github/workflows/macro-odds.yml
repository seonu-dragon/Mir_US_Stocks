name: Macro odds (prediction markets)

# 예측시장 확률(Kalshi · Polymarket 공개 API, 키 없음) + 침체 신호 모음 — 하루 3회.
# 침체 신호는 산업 지표(data/industry_indicators.json)를 재사용하므로 Industry indicators(06:10 KST)
# 뒤인 06:37 에 첫 실행을 둔다. Polymarket 은 한국 IP 에서 451 로 막히지만 미국 러너에서는 열린다.
on:
  schedule:
    - cron: "37 21,5,13 * * *"  # 06:37 · 14:37 · 22:37 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mir-publish-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Build macro odds
        run: python scripts/build_macro_odds.py --push
      # 빌더가 한쪽 거래소 실패를 삼켜도 산출물 나이로 마지막 관문을 세운다.
      - name: Data freshness gate
        run: python scripts/check_data_freshness.py --group macro-odds
      - name: Notify failure (Telegram)
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          MSG="[Mir Actions 실패] ${{ github.workflow }} ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" >/dev/null
