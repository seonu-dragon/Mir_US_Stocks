name: Market calendar + ETF holdings

# 통합 캘린더 데이터 두 가지 + 미국 ETF 구성.
# - calendar(매일 06:40 KST): 휴장·단축거래·파생 만기·FOMC(exchange_calendars 오프라인 계산) +
#   국내 실적 IR 일정(DART 기업설명회 개최 공시 원문 파싱, DART_API_KEY).
# - etf(매월 3일 06:10 KST 또는 수동 dispatch 의 etf=true): SEC N-PORT 로 순자산 상위 300 ETF 의
#   보유 상위 25·섹터/국가 노출 + 종목별 '이 종목을 담은 ETF'. 바뀐 샤드만 커밋한다.
#   OpenFIGI(CUSIP → 티커)는 무키로 돈다 — OPENFIGI_API_KEY 시크릿이 있으면 더 빠르다(선택).
on:
  schedule:
    - cron: "40 21 * * *"   # 21:40 UTC = KST 06:40 매일
    - cron: "10 21 2 * *"   # 매월 2일 21:10 UTC = KST 3일 06:10 (ETF 구성)
  workflow_dispatch:
    inputs:
      etf:
        description: "ETF 구성(N-PORT)도 다시 만들기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mir-publish-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exchange_calendars
        # 버전은 scripts/requirements-actions.txt 한 곳에서 고정한다.
        run: pip install "$(grep -E '^exchange_calendars==' scripts/requirements-actions.txt)"
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Build market calendar (holidays · expiries · FOMC)
        run: python scripts/build_market_calendar.py --push
      - name: Build KR IR schedule (DART)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/build_kr_ir_schedule.py --push
      - name: Data freshness gate
        run: python scripts/check_data_freshness.py --group market-calendar
      - name: Notify failure (Telegram)
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          MSG="[Mir Actions 실패] ${{ github.workflow }} (calendar) ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" >/dev/null

  etf:
    if: github.event.schedule == '10 21 2 * *' || (github.event_name == 'workflow_dispatch' && inputs.etf)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Build US ETF holdings (SEC N-PORT)
        env:
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: python scripts/build_us_etf_holdings.py --push
      - name: Data freshness gate
        run: python scripts/check_data_freshness.py --group etf-holdings
      - name: Notify failure (Telegram)
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          MSG="[Mir Actions 실패] ${{ github.workflow }} (etf) ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" >/dev/null
