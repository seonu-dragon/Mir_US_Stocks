name: Material events (SEC 8-K)

on:
  # 정시 실행: Cloudflare 워커 mir-cron 이 아래 시각(UTC cron)에 workflow_dispatch 로 깨운다.
  # GitHub `schedule:` 은 5~8시간 늦게 출발해 2026-10-01 에 옮겼다 — DEPLOY.md "정시 실행 워커".
  # 시각을 바꾸면 `node scripts/sync_cron_worker.mjs` 로 .github/mir-cron.json 을 다시 만든다.
  # mir-cron: "23 4 * * *"  # 04:23 UTC (KST 13:23)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mir-publish-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # 얕은 체크아웃으로 충분하다 — 빌더의 fetch → pull --rebase → push 는 depth 1
          # 에서도 동작하고, 2.5GB 짜리 .git pack 을 run 마다 받지 않는다.
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # 8-K 3줄 요약: 규칙 기반(LLM 없음)이 기본이고, --llm-max 건만 시총 상위의 중요 Item 을
      # Gemini flash-lite 로 요약한다(원문에 없는 숫자가 든 줄은 버림, 결과는 행에 캐시). 무료 한도를
      # 보도자료 요약·특징주 사유와 나눠 쓰므로 실행당 2건. 키가 없으면 규칙 요약만.
      - name: Build material events
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/build_material_events.py --backfill-days 14 --top 1500 --llm-max 2 --push
      # 실적 보도자료 한국어 요약: 위 피드의 Item 2.02 8-K → EX-99.1 원문 → Gemini.
      # 요약 숫자는 원문 텍스트에 있는지 검증해 없으면 버린다. 한 실행 최대 30건.
      - name: Earnings press release summaries (Gemini)
        continue-on-error: true
        timeout-minutes: 20
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/build_earnings_releases.py --push
      - name: Earnings releases freshness gate
        run: python scripts/check_data_freshness.py --group earnings-releases
      # 실패 시 텔레그램 통지 — 신선도 감시가 워크플로우를 빨갛게 만들어도
      # Actions 탭을 안 보면 모른다. 마지막 관문의 알림 루프를 여기서 닫는다.
      # (continue-on-error 스텝의 실패는 job 실패가 아니라서 여기 안 걸린다 — 의도)
      # 빌더 스텝이 실패를 삼켜도 산출물 나이로 마지막 관문을 세운다.
      - name: Data freshness gate
        run: python scripts/check_data_freshness.py --group sec-daily
      - name: Notify failure (Telegram)
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          MSG="[Mir Actions 실패] ${{ github.workflow }} ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" >/dev/null
