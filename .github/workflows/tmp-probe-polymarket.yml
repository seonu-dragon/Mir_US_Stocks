name: TMP probe polymarket
on:
  push:
    branches: [feat/macro-odds]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python scripts/build_macro_odds.py || true
          python - <<'PY'
          import json
          d=json.load(open('data/macro_odds.json',encoding='utf-8'))
          print(d['sources']); print(d['excluded'])
          for g in d['groups']:
              print(g['venue'],g['topic'],g['eventId'],g['eventTitle'],g['closeTime'],g['volume'],g['liquidity'],g['rules'][:160])
              for o in g['outcomes']:
                  print('   ',o['raw'],'|',o['label'],o['prob'],o['bid'],o['ask'],len(o['history']),o['history'][-2:])
          PY
