name: Weekly earnings history refresh

on:
  schedule:
    - cron: "2 18 * * 6"  # 일요일 03:02 KST (UTC 토요일 18:02)
  workflow_dispatch:
    inputs:
      only_financials:
        description: "재무 확장(financials 잡)만 실행 — 실적·DART 소유구조 등 earnings 잡은 건너뛴다"
        type: boolean
        default: false
      kr_max_calls:
        description: "KR 재무 확장 DART 호출 상한(평일 수동 실행이면 다른 DART 빌더와 안 겹쳐 크게 잡아도 된다)"
        type: string
        default: "4000"

permissions:
  contents: write

concurrency:
  group: mir-publish-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  earnings:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.only_financials }}
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 실측 4시간 20분(2026-08-30 성공 run) — 120 으로 줄이면 매주 잘린다
    steps:
      - uses: actions/checkout@v4
        with:
          # 얕은 체크아웃으로 충분하다 — 빌더의 fetch → pull --rebase → push 는 depth 1
          # 에서도 동작하고, 2.5GB 짜리 .git pack 을 run 마다 받지 않는다.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-actions.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-actions.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Incremental earnings history refresh
        continue-on-error: true
        run: python scripts/earnings_history_store.py --resume

      # KR 분기 실적(DART). 분기보고서가 나올 때만 값이 바뀌므로 주간이면 충분하다.
      # 산출물 data/korea/earnings.json 은 브라우저가 직접 읽지 않는다(2.4MB) —
      # update_korea_data.py 가 스냅샷 빌드 때 종목별 earningsHistory 로 붙인다.
      - name: KR quarterly earnings (DART)
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/build_kr_earnings.py --push

      # 성장성·안정성 지표. 다중회사 API 라 39회면 끝나지만, 값이 사업보고서에만
      # 바뀌므로 주간으로 충분하다.
      - name: KR financial indicators (DART)
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/build_kr_indicators.py --push

      # 소액주주·자기주식·최대주주. 셋 다 corp_code 가 필수라 벌크가 안 돼
      # 종목당 3회(≈7,800회, 1시간대)다. 값이 사업보고서에만 바뀌므로 주간이면 충분하다.
      - name: KR ownership profile (DART)
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/build_kr_ownership_profile.py --push

      # 감사의견. 비적정(의견거절/한정)은 상장폐지 사유라 종목 헤더에 경고로 나간다.
      # 값이 사업보고서(연 1회)에만 바뀌므로 주간이면 충분하다. 2,600종목 5분.
      - name: KR audit opinions (DART)
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/build_kr_audit_opinion.py --push

      # 다년 재무(DART 연간 주요계정) 10년. 연간 데이터라 주간이면 충분.
      # update_korea_data 의 attach_kr_financials_history 가 매일 이 파일을 읽어 detail 에 붙인다.
      - name: KR financials history (DART)
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/build_kr_financials_history.py --push

      # 국민연금 종목별 보유내역(공공데이터포털 파일데이터). 연 1회(연말 기준)
      # 갱신 데이터라 주간이면 차고 넘친다 — 실행이 저비용이라 여기 실어 둔다.
      # 파일데이터는 키 불필요(env 는 만일의 API 폴백 대비, 현재 경로에선 안 쓴다).
      - name: KR NPS holdings (공공데이터포털)
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/build_kr_nps_holdings.py --push

      # 공정위 공시대상기업집단 소속회사 → 그룹사 매핑(기업집단포털 오픈API).
      # 연 1회(5/1 지정) 갱신 데이터라 주간이면 차고 넘친다 — 실행이 저비용이라 여기 실어 둔다.
      - name: KR corp groups (공정위 기업집단)
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/build_kr_corp_groups.py --push

      # 미국 다년 재무(SEC EDGAR XBRL). API 키 불필요, User-Agent 만 필요.
      - name: US financials history (SEC)
        continue-on-error: true
        run: python scripts/build_us_financials_history.py --push
      # 위 빌더 스텝은 continue-on-error 라 소스가 영구히 죽어도 워크플로우는 초록이다.
      # 산출물의 타임스탬프 나이로 마지막 관문을 세운다(scripts/check_data_freshness.py).
      - name: Data freshness gate
        run: python scripts/check_data_freshness.py --group weekly
      # 실패 시 텔레그램 통지 — 신선도 감시가 워크플로우를 빨갛게 만들어도
      # Actions 탭을 안 보면 모른다. 마지막 관문의 알림 루프를 여기서 닫는다.
      # (continue-on-error 스텝의 실패는 job 실패가 아니라서 여기 안 걸린다 — 의도)
      - name: Notify failure (Telegram)
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          MSG="[Mir Actions 실패] ${{ github.workflow }} ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" >/dev/null

  # 재무 확장(연간 10년·분기 12개·TTM, 현금흐름·희석 주식수·차입금 등). earnings 잡이 4시간을 넘게
  # 돌아 같은 잡에 넣으면 360분 한도에 걸린다 — 별도 잡(별도 러너)으로 병렬 실행한다. 워크플로우
  # 이름은 그대로라 deploy-pages.yml 의 workflow_run 트리거도 그대로다.
  # DART 는 earnings 잡의 소유구조·감사의견 빌더와 하루 한도를 나눠 쓰므로 KR 은 호출 상한(기본 4,000)
  # 안에서 우선순위대로 받고 다음 주에 이어 받는다(build_financials_kr.py docstring).
  financials:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-actions.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-actions.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # SEC companyfacts. 키 불필요(User-Agent 만). EDGAR 일별 색인으로 새 10-K·10-Q 를 낸 회사만 다시 받는다.
      - name: US financials expanded (SEC)
        continue-on-error: true
        run: python scripts/build_financials_us.py --push

      - name: KR financials expanded (DART)
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KR_MAX_CALLS: ${{ inputs.kr_max_calls || '4000' }}
        run: python scripts/build_financials_kr.py --push --max-calls "$KR_MAX_CALLS"

      # 역DCF 기저율 분포 — 위 두 스텝이 갱신한 종목 파일로 다시 계산(네트워크 없음, 몇 초).
      - name: DCF base rates
        continue-on-error: true
        run: python scripts/build_dcf_base_rates.py --push

      - name: Data freshness gate
        run: python scripts/check_data_freshness.py --group financials

      - name: Notify failure (Telegram)
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          MSG="[Mir Actions 실패] ${{ github.workflow }} (financials) ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" >/dev/null
