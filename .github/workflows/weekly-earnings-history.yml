name: Weekly earnings history refresh

on:
  schedule:
    - cron: "2 18 * * 6"  # 일요일 03:02 KST (UTC 토요일 18:02)
  workflow_dispatch:
    inputs:
      only_financials:
        description: "재무 확장(financials 잡)만 실행 — us-and-public·kr-dart·weekly-gate 잡은 건너뛴다"
        type: boolean
        default: false
      kr_max_calls:
        description: "KR 재무 확장 DART 호출 상한(러너에서 1회 약 1.4초 — 3000이면 약 70분. 시간 예산에 걸리면 받은 데까지 저장하고 멈춘다)"
        type: string
        default: "3000"

permissions:
  contents: write

concurrency:
  group: mir-publish-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # ── 잡 분할(2026-09-26) ──────────────────────────────────────────────────────────────
  # 예전엔 earnings 잡 하나에 11개 스텝이 줄지어 있었다. 08-22·09-05·09-19 세 번, `KR quarterly
  # earnings (DART)` 스텝이 평소 1시간 걸리던 것을 5시간 넘게 붙잡아(로그 0줄) 잡이 360분 한도로
  # 취소됐고, 뒤에 줄 선 7개 스텝이 한 번도 못 돌아 8개 파일이 09-13 에 멈췄다(weekly 신선도 실패).
  # 이제 성격별로 잡을 나눠 병렬로 돌리고(서로를 막지 않는다), 모든 수집 스텝에
  #   - python -u(진행 로그가 실시간으로 보인다)
  #   - 시간 예산(--time-budget-min, 잡 시작 기준 남은 시간에서 계산 — scripts/step_budget.py)
  #   - 스텝 timeout-minutes(예산을 못 지키는 경우의 마지막 안전판)
  #   - 못 받은 종목은 직전 값 이월 · 없는 종목부터 받기
  # 를 둔다. 신선도 관문은 두 잡이 끝난 뒤 최신 main 을 받아 한 번만 본다(weekly-gate).
  # 스텝별 실측(09-12 성공 run): 실적 이력 59분 · KR 분기실적 61분 · KR 지표 2분 · 소유구조 81분 ·
  # 감사의견 27분 · KR 다년재무 7분 · 국민연금 0분 · 기업집단 0분 · US 다년재무 4분.

  # 야후·SEC·공공데이터포털 — DART 를 안 쓰는 스텝. 짧은 것부터, 가장 긴 실적 이력은 남은 시간 안에서.
  us-and-public:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.only_financials }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      JOB_LIMIT: 150
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          # 얕은 체크아웃으로 충분하다 — 빌더의 fetch → pull --rebase → push 는 depth 1
          # 에서도 동작하고, 2.5GB 짜리 .git pack 을 run 마다 받지 않는다.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-actions.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-actions.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 미국 다년 재무(SEC EDGAR XBRL). API 키 불필요, User-Agent 만 필요. 실측 3~4분.
      - name: US financials history (SEC)
        continue-on-error: true
        timeout-minutes: 25
        run: python -u scripts/build_us_financials_history.py --push

      # 국민연금 종목별 보유내역(공공데이터포털 파일데이터). 연 1회(연말 기준) 갱신 데이터라
      # 주간이면 차고 넘친다. 파일데이터는 키 불필요(env 는 만일의 API 폴백 대비).
      - name: KR NPS holdings (공공데이터포털)
        continue-on-error: true
        timeout-minutes: 10
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python -u scripts/build_kr_nps_holdings.py --push

      # 공정위 공시대상기업집단 소속회사 → 그룹사 매핑(기업집단포털 오픈API). 연 1회(5/1 지정).
      - name: KR corp groups (공정위 기업집단)
        continue-on-error: true
        # 페이지마다 TLS 핸드셰이크 타임아웃 재시도(최대 5회, 대기 5·15·30·60초)가 있어 10분이면 모자랄 수 있다.
        timeout-minutes: 20
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python -u scripts/build_kr_corp_groups.py --push

      # 야후 실적 이력 5,800종목. 실측 50~90분. 예산에 걸리면 멈춘 위치를 meta.nextOffset 에 남기고
      # 다음 주는 거기서부터 돈다.
      - name: Incremental earnings history refresh
        continue-on-error: true
        timeout-minutes: 130
        shell: bash
        run: |
          BUDGET=$(python scripts/step_budget.py --job-limit "$JOB_LIMIT" --reserve 10 --cap 120)
          echo "[실적이력] 시간 예산 ${BUDGET}분"
          if [ "$BUDGET" -lt 5 ]; then echo "[실적이력] 남은 시간 부족 — 건너뛴다"; exit 0; fi
          python -u scripts/earnings_history_store.py --resume --time-budget-min "$BUDGET"

      - name: Notify failure (Telegram)
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          MSG="[Mir Actions 실패] ${{ github.workflow }} (us-and-public) ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" >/dev/null

  # DART 수집(하루 한도를 financials 잡의 KR 재무 확장과 나눠 쓴다). 짧은 것부터 — 긴 스텝이
  # 느려져도 짧은 것들은 이미 끝나 있다. 긴 세 스텝은 각자 상한(cap) 안에서, 남은 시간이 적으면 줄어든다.
  kr-dart:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.only_financials }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      JOB_LIMIT: 300
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-actions.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-actions.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 성장성·안정성 지표. 다중회사 API 라 39회면 끝난다(실측 2분). 값이 사업보고서에만 바뀐다.
      - name: KR financial indicators (DART)
        continue-on-error: true
        timeout-minutes: 15
        run: python -u scripts/build_kr_indicators.py --push

      # 다년 재무(DART 연간 주요계정) 10년. 실측 6~7분.
      # update_korea_data 의 attach_kr_financials_history 가 매일 이 파일을 읽어 detail 에 붙인다.
      - name: KR financials history (DART)
        continue-on-error: true
        timeout-minutes: 25
        run: python -u scripts/build_kr_financials_history.py --push

      # 감사의견. 비적정(의견거절/한정)은 상장폐지 사유라 종목 헤더에 경고로 나간다. 실측 25~27분.
      - name: KR audit opinions (DART)
        continue-on-error: true
        timeout-minutes: 50
        shell: bash
        run: |
          BUDGET=$(python scripts/step_budget.py --job-limit "$JOB_LIMIT" --reserve 10 --cap 40)
          echo "[감사의견] 시간 예산 ${BUDGET}분"
          if [ "$BUDGET" -lt 3 ]; then echo "[감사의견] 남은 시간 부족 — 건너뛴다"; exit 0; fi
          python -u scripts/build_kr_audit_opinion.py --push --time-budget-min "$BUDGET"

      # KR 분기 실적(DART) + 현금흐름·EV. 평소 1시간. 09-19 에는 5시간 넘게 멈춰 잡을 통째로 잃었다.
      # 산출물 data/korea/earnings.json 은 브라우저가 직접 읽지 않는다(2.4MB) —
      # update_korea_data.py 가 스냅샷 빌드 때 종목별 earningsHistory 로 붙인다.
      - name: KR quarterly earnings (DART)
        continue-on-error: true
        timeout-minutes: 100
        shell: bash
        run: |
          BUDGET=$(python scripts/step_budget.py --job-limit "$JOB_LIMIT" --reserve 10 --cap 90)
          echo "[분기실적] 시간 예산 ${BUDGET}분"
          if [ "$BUDGET" -lt 5 ]; then echo "[분기실적] 남은 시간 부족 — 건너뛴다"; exit 0; fi
          python -u scripts/build_kr_earnings.py --push --time-budget-min "$BUDGET"

      # 소액주주·자기주식·최대주주. 셋 다 corp_code 가 필수라 벌크가 안 돼 종목당 3회(≈7,800회,
      # 실측 76~81분). 값이 사업보고서에만 바뀌므로 못 받은 종목은 직전 값 이월로 충분하다.
      - name: KR ownership profile (DART)
        continue-on-error: true
        timeout-minutes: 130
        shell: bash
        run: |
          BUDGET=$(python scripts/step_budget.py --job-limit "$JOB_LIMIT" --reserve 10 --cap 120)
          echo "[프로필] 시간 예산 ${BUDGET}분"
          if [ "$BUDGET" -lt 5 ]; then echo "[프로필] 남은 시간 부족 — 건너뛴다"; exit 0; fi
          python -u scripts/build_kr_ownership_profile.py --push --time-budget-min "$BUDGET"

      - name: Notify failure (Telegram)
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          MSG="[Mir Actions 실패] ${{ github.workflow }} (kr-dart) ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" >/dev/null

  # 위 빌더 스텝은 continue-on-error 라 소스가 영구히 죽어도 워크플로우는 초록이다.
  # 두 잡이 끝난 뒤(성공·실패 무관) 최신 main 을 받아 산출물 타임스탬프 나이로 마지막 관문을 세운다.
  weekly-gate:
    needs: [us-and-public, kr-dart]
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || !inputs.only_financials) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # github.sha 가 아니라 두 잡이 push 한 뒤의 main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Data freshness gate
        run: python -u scripts/check_data_freshness.py --group weekly

      # 실패 시 텔레그램 통지 — 신선도 감시가 워크플로우를 빨갛게 만들어도 Actions 탭을 안 보면 모른다.
      - name: Notify failure (Telegram)
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          MSG="[Mir Actions 실패] ${{ github.workflow }} (weekly 신선도) ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" >/dev/null

  # 재무 확장(연간 10년·분기 12개·TTM, 현금흐름·희석 주식수·차입금 등). 예전 earnings 잡이 4시간을 넘게
  # 돌아 같은 잡에 넣으면 360분 한도에 걸린다 — 별도 잡(별도 러너)으로 병렬 실행한다. 워크플로우
  # 이름은 그대로라 deploy-pages.yml 의 workflow_run 트리거도 그대로다.
  # DART 는 kr-dart 잡의 소유구조·감사의견 빌더와 하루 한도를 나눠 쓰므로 KR 은 호출 상한(기본 3,000)
  # 안에서 우선순위대로 받고 다음 주에 이어 받는다(build_financials_kr.py docstring).
  # 2026-09-26: 10,000회 수동 실행이 240분에 잘려 로그 0줄·중간 커밋 없이 전부 유실 → python -u,
  # 잡 시작 시각 기준 시간 예산(한도 25분 전에 멈춤), 150종목/20분마다 중간 커밋·push.
  financials:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Record job start
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-actions.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-actions.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # SEC companyfacts. 키 불필요(User-Agent 만). EDGAR 일별 색인으로 새 10-K·10-Q 를 낸 회사만 다시 받는다.
      - name: US financials expanded (SEC)
        continue-on-error: true
        timeout-minutes: 30
        run: python -u scripts/build_financials_us.py --push

      # US PER·PBR·PSR 밴드 — 방금 갱신된 data/financials/*.json 과 레포의 data/details 일봉만 읽는다
      # (외부 호출 0). 월말 배수 약 5년 + 저PBR 검증(SPY 대비)을 매번 전체 재계산(수 초).
      - name: US valuation band (PER/PBR/PSR)
        continue-on-error: true
        timeout-minutes: 15
        run: python -u scripts/build_us_valuation_band.py --push

      - name: KR financials expanded (DART)
        continue-on-error: true
        timeout-minutes: 220    # 스크립트 시간 예산(잡 한도 25분 전)이 먼저 멈춘다 — 이건 마지막 안전판
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KR_MAX_CALLS: ${{ inputs.kr_max_calls || '3000' }}
        shell: bash
        run: |
          # 잡 한도 240분 − 여유 25분(마지막 push·DCF 기저율·신선도 관문) − 앞 스텝이 쓴 시간
          NOW=$(date +%s)
          BUDGET=$(( (JOB_START_EPOCH + (240 - 25) * 60 - NOW) / 60 ))
          if [ "$BUDGET" -lt 5 ]; then echo "[KR재무] 남은 시간 ${BUDGET}분 — 건너뛴다"; exit 0; fi
          echo "[KR재무] 시간 예산 ${BUDGET}분 · 호출 상한 ${KR_MAX_CALLS}"
          python -u scripts/build_financials_kr.py --push --max-calls "$KR_MAX_CALLS" --time-budget-min "$BUDGET"

      # 역DCF 기저율 분포 — 위 두 스텝이 갱신한 종목 파일로 다시 계산(네트워크 없음, 몇 초).
      - name: DCF base rates
        continue-on-error: true
        timeout-minutes: 15
        run: python -u scripts/build_dcf_base_rates.py --push

      - name: Data freshness gate
        run: python -u scripts/check_data_freshness.py --group financials

      - name: Notify failure (Telegram)
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          MSG="[Mir Actions 실패] ${{ github.workflow }} (financials) ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" >/dev/null
