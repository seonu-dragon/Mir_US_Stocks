name: Weekly earnings history refresh

on:
  schedule:
    - cron: "2 18 * * 6"  # 일요일 03:02 KST (UTC 토요일 18:02)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mir-publish-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  earnings:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-actions.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-actions.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Incremental earnings history refresh
        continue-on-error: true
        run: python scripts/earnings_history_store.py --resume

      # KR 분기 실적(DART). 분기보고서가 나올 때만 값이 바뀌므로 주간이면 충분하다.
      # 산출물 data/korea/earnings.json 은 브라우저가 직접 읽지 않는다(2.4MB) —
      # update_korea_data.py 가 스냅샷 빌드 때 종목별 earningsHistory 로 붙인다.
      - name: KR quarterly earnings (DART)
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/build_kr_earnings.py --push

      # 성장성·안정성 지표. 다중회사 API 라 39회면 끝나지만, 값이 사업보고서에만
      # 바뀌므로 주간으로 충분하다.
      - name: KR financial indicators (DART)
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/build_kr_indicators.py --push

      # 소액주주·자기주식·최대주주. 셋 다 corp_code 가 필수라 벌크가 안 돼
      # 종목당 3회(≈7,800회, 1시간대)다. 값이 사업보고서에만 바뀌므로 주간이면 충분하다.
      - name: KR ownership profile (DART)
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/build_kr_ownership_profile.py --push

      # 감사의견. 비적정(의견거절/한정)은 상장폐지 사유라 종목 헤더에 경고로 나간다.
      # 값이 사업보고서(연 1회)에만 바뀌므로 주간이면 충분하다. 2,600종목 5분.
      - name: KR audit opinions (DART)
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/build_kr_audit_opinion.py --push

      # 다년 재무(DART 연간 주요계정) 10년. 연간 데이터라 주간이면 충분.
      # update_korea_data 의 attach_kr_financials_history 가 매일 이 파일을 읽어 detail 에 붙인다.
      - name: KR financials history (DART)
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/build_kr_financials_history.py --push

      # 국민연금 종목별 보유내역(공공데이터포털 파일데이터). 연 1회(연말 기준)
      # 갱신 데이터라 주간이면 차고 넘친다 — 실행이 저비용이라 여기 실어 둔다.
      # 파일데이터는 키 불필요(env 는 만일의 API 폴백 대비, 현재 경로에선 안 쓴다).
      - name: KR NPS holdings (공공데이터포털)
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/build_kr_nps_holdings.py --push

      # 미국 다년 재무(SEC EDGAR XBRL). API 키 불필요, User-Agent 만 필요.
      - name: US financials history (SEC)
        continue-on-error: true
        run: python scripts/build_us_financials_history.py --push
      # 실패 시 텔레그램 통지 — 신선도 감시가 워크플로우를 빨갛게 만들어도
      # Actions 탭을 안 보면 모른다. 마지막 관문의 알림 루프를 여기서 닫는다.
      # (continue-on-error 스텝의 실패는 job 실패가 아니라서 여기 안 걸린다 — 의도)
      - name: Notify failure (Telegram)
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          MSG="[Mir Actions 실패] ${{ github.workflow }} ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" >/dev/null
