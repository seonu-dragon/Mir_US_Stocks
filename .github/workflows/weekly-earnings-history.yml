name: Weekly earnings history refresh

on:
  schedule:
    - cron: "2 18 * * 6"  # 일요일 03:02 KST (UTC 토요일 18:02)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mir-data-publish
  cancel-in-progress: false

jobs:
  earnings:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-actions.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-actions.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Incremental earnings history refresh
        run: python scripts/earnings_history_store.py --resume

      # KR 분기 실적(DART). 분기보고서가 나올 때만 값이 바뀌므로 주간이면 충분하다.
      # 산출물 data/korea/earnings.json 은 브라우저가 직접 읽지 않는다(2.4MB) —
      # update_korea_data.py 가 스냅샷 빌드 때 종목별 earningsHistory 로 붙인다.
      - name: KR quarterly earnings (DART)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/build_kr_earnings.py --push

      # 성장성·안정성 지표. 다중회사 API 라 39회면 끝나지만, 값이 사업보고서에만
      # 바뀌므로 주간으로 충분하다.
      - name: KR financial indicators (DART)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/build_kr_indicators.py --push

      # 소액주주·자기주식·최대주주. 셋 다 corp_code 가 필수라 벌크가 안 돼
      # 종목당 3회(≈7,800회, 1시간대)다. 값이 사업보고서에만 바뀌므로 주간이면 충분하다.
      - name: KR ownership profile (DART)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/build_kr_ownership_profile.py --push