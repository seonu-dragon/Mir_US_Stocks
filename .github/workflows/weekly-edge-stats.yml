name: Weekly edge stats (S/R · breakout)

# 확률 엔진(analysis.js)이 쓰는 오프라인 엣지 통계를 갱신한다.
# data/details/*.json 만 읽는 순수 백테스트라 외부 API·시크릿이 필요 없다.
# 수동 실행만 가능했던 탓에 2026-06-23/24 이후 3주간 방치돼 있었다.

on:
  schedule:
    - cron: "20 19 * * 6"  # 일요일 04:20 KST (UTC 토요일 19:20) — 주간 실적 이력 갱신 뒤
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mir-publish-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          # 얕은 체크아웃으로 충분하다 — 빌더의 fetch → pull --rebase → push 는 depth 1
          # 에서도 동작하고, 2.5GB 짜리 .git pack 을 run 마다 받지 않는다.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # JS(analysis.js)와 PY(pattern_lib.py) 패턴 감지기는 1:1 동일이 계약이다.
      # 2026-07-23 감사에서 실제로 조용한 드리프트(emaArray 시드, volume-climax 0 처리)가
      # 발견됐다 — 어긋난 채 통계를 갱신하면 base-rate 조회가 오염되므로, 여기서
      # 빨갛게 실패시킨다(continue-on-error 금지).
      - name: Check JS-PY pattern parity
        run: python scripts/check_pattern_parity.py

      # 참고: S/R 존중률 통계(build_sr_stats.py → data/sr_stats.json)는 2026-08-06
      # 부로 주간 스케줄에서 뺐다 — 결론이 '무작위 대비 엣지 없음'이라 확률 엔진도
      # UI 도 이 파일을 읽지 않는다(전 프론트 grep 0건 확인). 스크립트와 기존
      # data/sr_stats.json 은 검증 이력으로 남긴다. 필요하면 로컬 수동 실행:
      # py scripts/build_sr_stats.py

      - name: Build breakout/retest stats
        continue-on-error: true
        run: python scripts/build_breakout_retest.py --push

      # 상승확률 스캐너 순위 기준의 5년 워크포워드 검증(순수 Node, data/details 만 읽음).
      # 스캐너의 "순위 기준" 셀렉트는 여기서 validated: true 인 팩터만 올린다 —
      # 파일이 낡으면 검증 문구가 현재 공식과 어긋나므로 freshness 게이트(10일)에 등록.
      - name: Build factor validation (scanner ranking)
        continue-on-error: true
        shell: bash
        run: |
          node scripts/build_factor_validation.mjs
          if git diff --quiet data/factor_validation.json data/factor_validation.js; then
            echo "factor validation unchanged"
            exit 0
          fi
          git add data/factor_validation.json data/factor_validation.js
          git commit -m "Auto-update factor validation (weekly)"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1

      # 참고: data/korea/disclosure_stats.json (신뢰도 센터 소비)은 CI 에 편입할 수
      # 없다 — build_kr_disclosure_stats.py 는 gitignore 된 로컬 아카이브
      # (data/korea/_archive, 5년 공시+일봉 백필)를 입력으로 쓴다. 로컬에서
      # 분기 1회쯤 수동 갱신: py scripts/build_kr_disclosure_stats.py --push

      # 시총 상위 300 종목 셋이 바뀌면 sitemap 이 낡는다(2026-07-18 이후 방치돼
      # --check 실패 상태였다). 주간 재생성으로 자동화.
      - name: Rebuild sitemap
        continue-on-error: true
        shell: bash
        run: |
          python scripts/build_sitemap.py
          if git diff --quiet sitemap.xml; then
            echo "sitemap unchanged"
            exit 0
          fi
          git add sitemap.xml
          git commit -m "Auto-update sitemap (weekly)"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
      # 실패 시 텔레그램 통지 — 신선도 감시가 워크플로우를 빨갛게 만들어도
      # Actions 탭을 안 보면 모른다. 마지막 관문의 알림 루프를 여기서 닫는다.
      # (continue-on-error 스텝의 실패는 job 실패가 아니라서 여기 안 걸린다 — 의도)
      # 빌더 스텝이 실패를 삼켜도 산출물 나이로 마지막 관문을 세운다.
      - name: Data freshness gate
        run: python scripts/check_data_freshness.py --group edge-stats
      - name: Notify failure (Telegram)
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          MSG="[Mir Actions 실패] ${{ github.workflow }} ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MSG}" >/dev/null
