      .cprob-more-body { padding-top: 14px; }
      .cprob-more-body > .grid2:last-child,
      .cprob-more-body > .card:last-child { margin-bottom: 0; }

    <!-- 서비스 워커 등록 — index.html 과 같은 내용이되, 이 페이지는 build_id.js 를
         <body> 끝에서 읽으므로 load 이후에 등록한다. MIR_BUILD_ID 가 아직 없을 때
         등록하면 ./sw.js?v=dev 라는 *다른* 스크립트 URL 이 되어 같은 스코프의 SW 가
         매번 교체된다. -->
    <script>
      (function () {
        if (!("serviceWorker" in navigator)) return;
        window.addEventListener("load", function () {
          var v = window.MIR_BUILD_ID || "dev";
          navigator.serviceWorker.register("./sw.js?v=" + v, { updateViaCache: "none" }).then(function (reg) {
            reg.update();
          }).catch(function () {});
        });
      })();
    </script>
