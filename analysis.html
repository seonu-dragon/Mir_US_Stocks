    <style id="critical-css">
/* critical: tokens + reset */
:root {
  color-scheme: light;
  --bg: #f6f7f9;
  --panel: #ffffff;
  --panel-soft: #f8fafc;
  --text: #172033;
  --muted: #667085;
  --line: #d9dee7;
  --surface-2: #f1f5f9;
  --surface-3: #e2e8f0;
  --card: #ffffff;
  --blue: #1d4ed8;
  --primary: #1d4ed8;
  --green: #138a4d;
  --red: #c03535;
  --amber: #b7791f;
  --link: #1d4ed8;
  --chip-bg: #eff6ff;
  --chip-border: #bfdbfe;
  --chat-safe-bottom: 61px;

  /* ── 의미 색 보강 (일원화) ── */
  --text-muted: #667085;   /* 보조 텍스트 */
  --accent: #1d4ed8;       /* = primary */
  --pos: #138a4d;          /* = green */
  --neg: #c03535;          /* = red */
  /* 상태 틴트 (배지 배경 + 전경) */
  --tint-pos: #dcfce7;
  --tint-neg: #fee2e2;
  --tint-warn: #fef3c7;
  --tint-info: #dbeafe;
  --tint-pos-fg: #15803d;
  --tint-neg-fg: #b91c1c;
  --tint-warn-fg: #92400e;
  --tint-info-fg: #1e40af;

  /* ── 반경 스케일 (4단 + pill) ── */
  --r-xs: 4px;
  --r-sm: 6px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-pill: 999px;

  /* ── 그림자(고도) 스케일 ── */
  --shadow-sm: 0 2px 8px rgba(20, 30, 50, 0.06);
  --shadow: 0 10px 28px rgba(20, 30, 50, 0.08);     /* md (기존) */
  --shadow-lg: 0 18px 44px rgba(20, 30, 50, 0.12);

  /* ── 간격 스케일 (4·8·12·16·20·24) ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;

  /* 타이포그래피 스케일 (관심 리스트 · 종목 분석 페이지 공용) */
  --fs-stat: 18px;   /* 통계 카드 대표 수치 (4·3열 카드) */
  --fs-stat-sm: 16px;/* 컴팩트 KPI 수치 (8칸 facts) */
  --fs-h3: 16px;     /* 하위 섹션 제목 */
  --fs-body: 14px;   /* 패널 기준 본문 */
  --fs-table: 13px;  /* 표 셀 · 설명문 */
  --fs-label: 12px;  /* 컨트롤 라벨 */
  --fs-cap: 11px;    /* 작은 캡션 라벨 */
  --fw-semibold: 700;
  --fw-bold: 800;
}

* {
  box-sizing: border-box;
}
/* critical: base + topbar + brand */
html {
  scroll-padding-bottom: var(--chat-safe-bottom);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  /* CDN 이 싣는 건 "Pretendard Variable" 이라 이쪽이 먼저. "Pretendard" 는 로컬에
     설치된 사용자를 위해 남겨둔다. */
  font-family: "Pretendard Variable", "Pretendard", -apple-system, BlinkMacSystemFont,
    "Apple SD Gothic Neo", "Malgun Gothic", Arial, "Noto Sans KR", sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  /* 프리미엄 폴리시: 모든 수치를 등폭으로 정렬(자릿수가 딱 맞음 — 금융 대시보드 표준).
     기존엔 일부 컴포넌트에만 적용돼 있었다. */
  font-variant-numeric: tabular-nums;
}

/* 제목 자간을 살짝 좁혀 밀도 있는 프리미엄 헤드라인. */
h1, h2, h3, .section-title h2, .daily-action-head h2 {
  letter-spacing: -0.015em;
}

button,
input,
select {
  font: inherit;
}

.topbar {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  padding: 18px 24px 12px;
  background: linear-gradient(118deg, #13213b 0%, #0f172a 58%);
  color: #fff;
}
/* 시그니처 하단 액센트 라인 */
.topbar::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--primary), #60a5fa 35%, transparent 80%);
}

/* ===== 브랜드 로고 락업 ===== */
.brand-lockup {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  cursor: pointer;
}
.brand-lockup:focus-visible { outline: 2px solid #60a5fa; outline-offset: 4px; border-radius: var(--r-md); }
.brand-text { min-width: 0; }
.brand-text .eyebrow {
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-size: 10.5px;
  font-weight: 700;
}
.brand-text h1 {
  font-weight: 800;
  letter-spacing: -0.02em;
}
.brand-accent {
  background: linear-gradient(90deg, #93c5fd, #60a5fa);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.eyebrow {
  margin: 0 0 4px;
  color: #aeb8cc;
  font-size: var(--fs-table);
}

h1,
h2,
h3,
p {
  margin-top: 0;
}

h1 {
  margin-bottom: 0;
  font-size: 24px;
}

.update-card {
  min-width: 250px;
  padding: 10px 12px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: var(--r-md);
  background: rgba(255, 255, 255, 0.08);
}

.update-card span,
.update-card small {
  display: block;
  color: #cbd5e1;
  font-size: var(--fs-label);
}

.update-card strong {
  display: block;
  margin: 3px 0;
  font-size: 15px;
}

/* SNS 채널 아이콘 줄 (헤더 가운데) */
.social-links {
  display: flex;
  align-items: flex-start;
  gap: var(--space-2);
}

.social-link-wrap {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.social-tooltip {
  position: absolute;
  top: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%) translateY(4px);
  padding: 6px 10px;
  border-radius: var(--r-md);
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: rgba(15, 23, 42, 0.96);
  color: #e2e8f0;
  font-size: var(--fs-cap);
  font-weight: 600;
  line-height: 1.35;
  white-space: nowrap;
  text-align: center;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.15s ease, transform 0.15s ease, visibility 0.15s ease,
    background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  z-index: 20;
}

.social-tooltip::before {
  content: "";
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 5px solid transparent;
  border-bottom-color: rgba(15, 23, 42, 0.96);
  transition: border-bottom-color 0.15s ease;
}

/* critical: social-link base */
.social-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: var(--r-md);
  background: rgba(255, 255, 255, 0.14);
  border: 1px solid rgba(255, 255, 255, 0.32);
  color: #f1f5f9;
  transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
}

.social-link svg {
  width: 16px;
  height: 16px;
  fill: currentColor;
}

/* SNS 줄 끝의 앱 설치 버튼(항상 표시, 설치되면 숨김) — 평소 흑백, 호버 시 파란색 */
.social-link.sl-install {
  padding: 0;
  cursor: pointer;
}

.social-link.sl-install:hover {
  background: #2563eb;
  border-color: #2563eb;
}

.social-link.sl-install[hidden] {
  display: none;
}

.social-link svg path {
  fill: currentColor;
}

.social-link:hover {
  transform: translateY(-2px);
  color: #fff;
}

.social-link.sl-instagram:hover {
  background: #d6249f;
  border-color: #d6249f;
}

.social-link.sl-x:hover {
  background: #000;
  border-color: #000;
}

.social-link.sl-threads:hover {
  background: #000;
  border-color: #000;
}

.social-link.sl-naver:hover {
  background: #03c75a;
  border-color: #03c75a;
}

/* critical: main + summary band */
main {
  width: min(1440px, 100%);
  margin: 0 auto;
  padding: 14px 16px 24px;
}

.summary-band {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: var(--space-3);
}

.summary-card,
.detail-panel,
.chart-card,
.health-block {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  box-shadow: var(--shadow);
}

.summary-card {
  padding: 13px;
}

.summary-card span {
  color: var(--muted);
  font-size: var(--fs-label);
}

.summary-card strong {
  display: block;
  margin-top: var(--space-1);
  font-size: 21px;
}

/* ===== Top header: Fear&Greed gauge / sector TOP5 / FX ===== */
/* 모든 카드 높이를 동일하게(가장 큰 = F&G 게이지 기준) + 내용으로 채워 빈공간 제거 */
.summary-band { align-items: stretch; }
.summary-band .summary-card { padding: 9px 11px; }
/* critical: index-strip + tabs + panel */
.index-strip {
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  gap: var(--space-2);
  margin-bottom: var(--space-4);
}
.index-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 8px 10px;
  box-shadow: var(--shadow);
}

.index-card-clickable {
  cursor: pointer;
  transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
}

.index-card-clickable:hover,
.index-card-clickable:focus-visible {
  border-color: #93c5fd;
  box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12);
  outline: none;
  transform: translateY(-1px);
}
.index-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 6px;
}
.index-head strong { font-size: var(--fs-label); }
.index-head em { font-style: normal; font-weight: 700; font-size: var(--fs-cap); }
.index-price { font-size: var(--fs-body); font-weight: 700; margin: 2px 0 4px; }
.spark { width: 100%; height: 40px; display: block; }
.spark-empty { height: 40px; }

@media (max-width: 1040px) {
  .index-strip { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  .index-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

.tabs-scroll-wrap {
  margin-bottom: 10px;
}

.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.tabs .tab {
  flex: 1 1 88px;
  min-width: max-content;
}

.tab {
  min-height: 40px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--panel);
  color: var(--muted);
  cursor: pointer;
  font-weight: 700;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

.tab.is-active {
  border-color: var(--blue);
  background: var(--blue);
  color: #fff;
}

/* 탭 순서 변경(드래그) */
.tab.is-dragging {
  opacity: 0.96;
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.32);
  cursor: grabbing;
}

.tabs.is-reordering {
  cursor: grabbing;
}

/* 그랩한 탭이 놓일 빈 자리 */
.tab-placeholder {
  flex: 0 0 auto;
  box-sizing: border-box;
  border: 1px dashed var(--blue);
  border-radius: var(--r-md);
  background: rgba(29, 78, 216, 0.08);
}

.panel {
  display: none;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: var(--space-4);
  box-shadow: var(--shadow);
}

/* 관심 리스트 · 종목 분석 패널: 기준 글자 크기를 14px로 고정해
   크기 미지정 텍스트가 16px로 튀는 불일치를 없앤다. */
#tab-bulk,
#tab-search {
  font-size: var(--fs-body);
  line-height: 1.5;
}

.panel.is-active {
  display: block;
}
/* critical: ghost-button */
.ghost-button {
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--panel);
  color: var(--text);
  padding: 9px 12px;
  font-weight: 800;
  cursor: pointer;
}
/* critical: footer */
footer {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 18px 24px 24px;
  color: var(--muted);
  font-size: var(--fs-label);
}

/* critical: nav flex + daily head */
.navigation-mode-bar,
.daily-action-card-head,
.daily-action-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
}

.daily-action-head h2 {
  margin: 2px 0 4px;
  font-size: 21px;
}

.daily-action-head p,
.navigation-mode-bar span {
  margin: 0;
  color: var(--muted);
  font-size: var(--fs-label);
}
/* critical: nav-mode-bar + switches */
.navigation-mode-bar {
  margin: 10px 0 8px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--panel);
}

.navigation-mode-bar strong,
.navigation-mode-bar span { display: block; }
.navigation-mode-bar strong { margin-bottom: 2px; font-size: var(--fs-table); }

.market-mode-switch {
  display: inline-flex;
  flex: 0 0 auto;
  padding: 3px;
  border-radius: var(--r-md);
  background: var(--panel-soft);
  border: 1px solid var(--line);
}

.market-mode-switch button {
  min-height: 34px;
  padding: 6px 12px;
  border: 0;
  border-radius: var(--r-sm);
  background: transparent;
  color: var(--muted);
  font-size: var(--fs-label);
  font-weight: 800;
  cursor: pointer;
  white-space: nowrap;
}

.market-mode-switch button.is-active {
  background: var(--panel);
  color: var(--primary);
  box-shadow: var(--shadow-sm);
}

html[data-market="kr"] .market-mode-switch button[data-market-mode="kr"].is-active {
  color: #dc2626;
}

.view-mode-switch {
  display: inline-flex;
  flex: 0 0 auto;
  padding: 3px;
  border-radius: var(--r-md);
  background: var(--panel-soft);
}

.view-mode-switch button {
  min-height: 34px;
  padding: 6px 11px;
  border: 0;
  border-radius: var(--r-sm);
  background: transparent;
  color: var(--muted);
  font-size: var(--fs-label);
  font-weight: 800;
  cursor: pointer;
}

.view-mode-switch button.is-active {
  background: var(--panel);
  color: var(--primary);
  box-shadow: var(--shadow-sm);
}

#mainTabs[data-view-mode="basic"] .tab[data-advanced="true"] {
  display: none;
}
/* critical: focus/hover/tab states */
.tab:focus-visible,
button:focus-visible {
  outline: 2px solid #2563eb;
  outline-offset: 2px;
}

/* 3) 버튼 호버/누름 피드백 (배경색은 각 컴포넌트 유지, 밝기만 조정) */
button:hover { filter: brightness(0.95); }
button:active { transform: translateY(1px); filter: brightness(0.9); }
button:disabled,
button[disabled] { opacity: 0.5; cursor: not-allowed; filter: none; transform: none; }
button:disabled:hover,
button[disabled]:hover { filter: none; }
button.ghost:hover { border-color: #c7d2fe; background: var(--panel-soft); }

/* 4) 메인 탭 호버/활성 강조 */
.tab:hover:not(.is-active) {
  border-color: #c7d2fe;
  color: var(--text);
  background: var(--panel-soft);
}
.tab.is-active { box-shadow: 0 4px 12px rgba(29, 78, 216, 0.25); }

/* 5) 입력/셀렉트 호버·포커스 (테두리 + 부드러운 링) */
select:hover,
input:hover { border-color: #c7d2fe; }
select:focus,
input:focus {
  outline: none;
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.16);
}

/* 6) 체크박스·라디오 테마 색 통일 */
/* critical: dark tokens */
html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b1220;
  --panel: #151d2e;
  --panel-soft: #1c2538;
  --surface-2: #1f2a40;
  --surface-3: #2a3650;
  --card: #151d2e;
  --text: #e6ecf5;
  --muted: #9aa6bb;
  --line: #2c3850;
  --shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
  --chip-bg: #1e293b;
  --chip-border: #334155;
  --blue: #3b82f6;
  --primary: #3b82f6;
  --link: #7dabff;
  --green: #34d399;
  --red: #f87171;
  --amber: #fbbf24;
  /* 보강 의미 색 */
  --text-muted: #9aa6bb;
  --accent: #3b82f6;
  --pos: #34d399;
  --neg: #f87171;
  /* 상태 틴트(다크) */
  --tint-pos: #14321f;
  --tint-neg: #3a1d1d;
  --tint-warn: #3a2f12;
  --tint-info: #16324f;
  --tint-pos-fg: #4ade80;
  --tint-neg-fg: #fca5a5;
  --tint-warn-fg: #fcd34d;
  --tint-info-fg: #93c5fd;
  /* 그림자(다크) */
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 18px 44px rgba(0, 0, 0, 0.6);
}
/* critical: home-zone-head + sticky tabs */
.home-zone-head {
  margin: var(--space-1) 0 var(--space-3);
}
.home-zone-head h2 {
  margin: 2px 0 3px;
  font-size: var(--fs-stat);
  letter-spacing: -0.01em;
}
.home-zone-head p {
  margin: 0;
  color: var(--muted);
  font-size: var(--fs-cap);
}
/* 홈 구역 일관 간격 */
.summary-band { margin-bottom: var(--space-4); }
.daily-action-board { margin: var(--space-5) 0 var(--space-4); }
/* 오늘의 액션 보드 = 개인 히어로: 더 또렷한 입체감 */
.daily-action-board { box-shadow: var(--shadow-lg); }

/* ============================================================
   상단 탭 고정 (sticky) — 스크롤해도 섹션 전환 가능
   ============================================================ */
.tabs-scroll-wrap {
  position: sticky;
  top: 0;
  z-index: 20;
  padding: 8px 0 6px;
  margin: 0 0 10px;
  background: var(--bg);
}

/* critical: home-search hero */
.home-search-section {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px 20px;
  background: radial-gradient(circle at top, rgba(30, 41, 59, 0.4) 0%, transparent 70%);
  border-bottom: 1px solid rgba(226, 232, 240, 0.05);
  margin-bottom: 20px;
}

[data-theme="light"] .home-search-section {
  background: radial-gradient(circle at top, rgba(219, 234, 254, 0.4) 0%, transparent 70%);
  border-bottom: 1px solid rgba(15, 23, 42, 0.05);
}

.home-search-inner {
  max-width: 720px;
  width: 100%;
  text-align: center;
}

.home-search-kicker {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.15em;
  color: var(--brand);
  text-transform: uppercase;
  display: inline-block;
  margin-bottom: 8px;
}

.home-search-title {
  font-size: 28px;
  font-weight: 800;
  color: var(--text);
  margin: 0 0 8px 0;
  letter-spacing: -0.02em;
}

.home-search-subtitle {
  font-size: 14px;
  color: var(--muted);
  margin: 0 0 24px 0;
}

.home-search-bar {
  display: flex;
  background: rgba(30, 41, 59, 0.5);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(226, 232, 240, 0.1);
  padding: 6px;
  border-radius: 40px;
  box-shadow: var(--shadow-md);
  transition: border-color 0.2s, box-shadow 0.2s;
  margin-bottom: 16px;
}

[data-theme="light"] .home-search-bar {
  background: rgba(255, 255, 255, 0.8);
  border: 1px solid rgba(15, 23, 42, 0.1);
}

.home-search-bar:focus-within {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
}

.home-search-bar input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  padding: 10px 18px;
  color: var(--text);
  font-size: 15px;
}

.home-search-bar input::placeholder {
  color: var(--muted);
}

.home-search-bar button {
  background: var(--brand);
  color: #ffffff;
  border: none;
  padding: 10px 24px;
  font-size: 14px;
  font-weight: 600;
  border-radius: 30px;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
}

.home-search-bar button:hover {
  opacity: 0.95;
}

.home-search-bar button:active {
  transform: scale(0.98);
}

.home-search-suggestions {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  font-size: 12px;
}

.search-suggest-chip {
  background: var(--panel-soft);
  border: 1px solid rgba(226, 232, 240, 0.08);
  color: var(--text-soft);
  padding: 6px 14px;
  border-radius: 20px;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, color 0.2s;
}

.search-suggest-chip:hover {
  background: rgba(99, 102, 241, 0.1);
  border-color: var(--brand);
  color: var(--brand);
}

/* critical: ai-mode-btn */
.ai-mode-btn {
  background: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(139, 92, 246, 0.15) 100%);
  border: 1px solid rgba(99, 102, 241, 0.3);
  color: #c084fc;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: all 0.3s ease;
  margin-left: 12px;
}

[data-theme="light"] .ai-mode-btn {
  background: linear-gradient(135deg, rgba(99, 102, 241, 0.08) 0%, rgba(139, 92, 246, 0.08) 100%);
  border: 1px solid rgba(99, 102, 241, 0.2);
  color: #7c3aed;
}

.ai-mode-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 0 12px rgba(139, 92, 246, 0.25);
  border-color: var(--brand);
}

.ai-mode-btn.active {
  background: var(--brand);
  color: #fff;
  border-color: var(--brand);
  box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
}

/* critical: hidden guard */
[hidden]{display:none !important}

    <style>
      .ca-main { max-width: 960px; margin: 0 auto; padding: 16px 16px 80px; }
      .ca-intro { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 4px 0 18px; }
      .ca-search { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
      .ca-search input { flex: 1 1 220px; padding: 12px 14px; font-size: 16px; border: 1px solid var(--line);
        border-radius: var(--r-md); background: var(--panel); color: var(--text); }
      .ca-search button { padding: 12px 20px; font-size: 15px; font-weight: 700; border: none;
        border-radius: var(--r-md); background: var(--primary); color: #fff; cursor: pointer; }
      .ca-hz { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
      .hz-btn { padding: 7px 14px; font-size: 13px; border: 1px solid var(--line); background: var(--panel);
        color: var(--muted); border-radius: var(--r-pill); cursor: pointer; }
      .hz-btn.is-active { background: var(--chip-bg); border-color: var(--chip-border); color: var(--primary); font-weight: 700; }
      .ca-examples { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
      .ca-examples button { background: none; border: none; color: var(--link); cursor: pointer; padding: 0 4px; font-size: 13px; }

      .notice { padding: 24px; text-align: center; color: var(--muted); background: var(--panel-soft);
        border: 1px solid var(--line); border-radius: var(--r-lg); }
      .notice.err { color: var(--neg); }

      .head-card { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
        padding: 16px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg);
        box-shadow: var(--shadow-sm); margin-bottom: 14px; }
      .head-card h2 { margin: 0 0 4px; font-size: 22px; }
      .head-card .muted { font-weight: 500; font-size: 15px; }
      .head-card p { margin: 0; font-size: 13px; }
      .verdict { font-size: 17px; font-weight: 800; white-space: nowrap; }

      .prob-wrap { margin-bottom: 18px; }
      .prob-bar { display: flex; height: 46px; border-radius: var(--r-md); overflow: hidden;
        font-weight: 800; color: #fff; box-shadow: var(--shadow-sm); }
      .prob-up { background: var(--pos); display: flex; align-items: center; padding-left: 14px; min-width: 48px;
        transition: width .4s ease; }
      .prob-down { background: var(--neg); display: flex; align-items: center; justify-content: flex-end;
        padding-right: 14px; min-width: 48px; transition: width .4s ease; }
      .prob-caption { text-align: center; font-size: 13px; color: var(--muted); margin: 8px 0 0; }

      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
      @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
      .cprob-top-grid { align-items: start; }
      .cprob-rstack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
      .cprob-rstack > .card { margin-bottom: 0; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg);
        padding: 14px 16px; box-shadow: var(--shadow-sm); }
      .card h3 { margin: 0 0 12px; font-size: var(--fs-h3); }
      .card h3 .muted { font-weight: 500; font-size: 12px; }
      .sig-group { margin-bottom: 12px; }
      .sig-group h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
      .sig-group h4.bull { color: var(--pos); }
      .sig-group h4.bear { color: var(--neg); }
      .sig-group h4.neu { color: var(--muted); }
      .sig-row { display: grid; grid-template-columns: 18px 92px 1fr 40px; align-items: center; gap: 8px;
        padding: 5px 0; font-size: 13px; border-bottom: 1px solid var(--surface-2); }
      .sig-row:last-child { border-bottom: none; }
      .sig-arrow { text-align: center; }
      .sig-row.is-bull .sig-arrow { color: var(--pos); }
      .sig-row.is-bear .sig-arrow { color: var(--neg); }
      .sig-row.is-neutral .sig-arrow { color: var(--muted); }
      .sig-label { font-weight: 600; }
      .sig-detail { color: var(--muted); font-size: 12px; }
      .sig-strength { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

      .base-line { font-size: 14px; line-height: 1.6; margin: 0 0 12px; }
      .base-stats { display: flex; gap: 16px; flex-wrap: wrap; }
      .base-stats > div { display: flex; flex-direction: column; }
      .base-stats span { font-size: 12px; }
      .base-stats b { font-size: 17px; }

      .pat-item { padding: 10px 0; border-bottom: 1px solid var(--surface-2); }
      .pat-item:last-of-type { border-bottom: none; }
      .pat-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
      .pat-name { font-weight: 700; font-size: 14px; }
      .pat-tag { font-size: 11px; padding: 1px 7px; border-radius: var(--r-pill);
        background: var(--chip-bg); color: var(--primary); border: 1px solid var(--chip-border); }
      .pat-when { font-size: 12px; }
      .pat-stat { margin: 0; font-size: 13px; line-height: 1.6; }
      .pat-edge { margin-left: 6px; font-size: 12px; font-weight: 700; }
      .pat-edge.pos { color: var(--pos); }
      .pat-edge.neg { color: var(--neg); }
      .pat-note { font-size: 11.5px; line-height: 1.5; margin: 10px 0 0; }

      .sr-line { display: flex; justify-content: space-between; align-items: center; font-size: 14px; gap: 8px; }
      .sr-line b { font-size: 16px; }
      .sr-cur b { color: var(--primary); }

      .disclaimer { margin-top: 16px; padding: 12px 14px; font-size: 12.5px; line-height: 1.6;
        color: var(--tint-warn-fg); background: var(--tint-warn); border-radius: var(--r-md); }

      /* 상세 분석 접이식(네이티브 <details>) — JS 없이 접힘/펼침 */
      .cprob-more { margin: 14px 0 0; }
      .cprob-more > summary { list-style: none; cursor: pointer; user-select: none;
        display: flex; align-items: center; gap: 10px; width: 100%; box-sizing: border-box;
        padding: 13px 16px; font-size: 14px; font-weight: 700; color: var(--text);
        background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg);
        box-shadow: var(--shadow-sm); }
      .cprob-more > summary::-webkit-details-marker { display: none; }
      .cprob-more > summary:hover { border-color: var(--chip-border); }
      .cprob-more-caret { flex: 0 0 auto; width: 8px; height: 8px; border-right: 2px solid var(--muted);
        border-bottom: 2px solid var(--muted); transform: rotate(-45deg); margin-left: 2px;
        transition: transform .2s ease; }
      .cprob-more[open] > summary .cprob-more-caret { transform: rotate(45deg); }
      .cprob-more[open] > summary { border-radius: var(--r-lg) var(--r-lg) 0 0; border-bottom-color: transparent; }
      .cprob-more-body { padding-top: 14px; }
      .cprob-more-body > .grid2:last-child,
      .cprob-more-body > .card:last-child { margin-bottom: 0; }
    </style>

  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Chart Probability</p>
        <h1>차트 확률 분석</h1>
      </div>
      <a class="ghost-button" href="index.html">← 대시보드</a>
    </header>

    <main class="ca-main">
      <p class="ca-intro">
        종목 티커를 입력하면 지난 5년 차트를 분석해 <b>상승/하락 확률</b>을 추정합니다.
        ① 추세·모멘텀·거래량 등 기술적 신호의 합의와, ② 과거 비슷한 상황에서 실제로 오른 비율(실측),
        ③ 최근 형성된 차트 패턴(쌍바닥·헤드앤숄더·삼각수렴·돌파)의 전 종목 과거 성공률을 함께 보여줍니다.
      </p>

      <form id="searchForm" class="ca-search" autocomplete="off">
        <input id="tickerInput" type="text" placeholder="티커 입력 (예: NVDA)" aria-label="티커" inputmode="latin" />
        <button type="submit">분석</button>
      </form>
      <div class="ca-examples">
        예시:
        <button type="button" onclick="document.getElementById('tickerInput').value='NVDA';document.getElementById('searchForm').requestSubmit()">NVDA</button>
        <button type="button" onclick="document.getElementById('tickerInput').value='AAPL';document.getElementById('searchForm').requestSubmit()">AAPL</button>
        <button type="button" onclick="document.getElementById('tickerInput').value='TSLA';document.getElementById('searchForm').requestSubmit()">TSLA</button>
        <button type="button" onclick="document.getElementById('tickerInput').value='MSFT';document.getElementById('searchForm').requestSubmit()">MSFT</button>
      </div>

      <div class="ca-hz" role="group" aria-label="예측 기간">
        <button type="button" class="hz-btn" data-hz="5">1주</button>
        <button type="button" class="hz-btn is-active" data-hz="20">1개월</button>
        <button type="button" class="hz-btn" data-hz="60">3개월</button>
      </div>

      <div id="result">
        <div class="notice">종목 티커를 입력하고 <b>분석</b>을 눌러 주세요.</div>
      </div>
    </main>

    <footer>
      <span>차트 패턴 기반 기술적 추정이며 매수/매도 추천이 아닙니다.</span>
      <span>투자 판단과 책임은 본인에게 있습니다.</span>
