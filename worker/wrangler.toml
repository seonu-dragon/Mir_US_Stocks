# =============================================================================
# Mir US Stocks — Cloudflare Worker 설정(참고용)
# =============================================================================
#
# 이 워커의 **정식 배포 경로는 대시보드 붙여넣기**다(DEPLOY.md 참고).
# 이 파일은 두 가지 용도로만 둔다:
#   1) 현재 바인딩 목록의 문서화 — 대시보드에서 손으로 만든 것과 이름이 같아야 한다.
#   2) Durable Object(COMMUNITY_DO)를 쓰려는 경우의 마이그레이션 정의 —
#      DO 클래스는 대시보드에서 만들 수 없고 `wrangler deploy` 로 한 번은 올려야 한다.
#      DO 는 **Workers 유료 플랜**($5/월)에서만 동작한다.
#
# 이 파일로 배포하려면(선택):
#   npm i -g wrangler
#   wrangler kv namespace create MOVE_CACHE      # 출력된 id 를 아래에 붙여넣기
#   wrangler kv namespace create COMMUNITY_KV
#   wrangler secret put FINNHUB_API_KEY          # GEMINI_API_KEY, NAVER_*, COMMUNITY_ADMIN_KEY, IP_HASH_SALT 도 동일
#   wrangler deploy
#
# COMMUNITY_DO 바인딩이 없으면 커뮤니티는 지금까지처럼 COMMUNITY_KV +
# version/stamp 재시도 경로로 동작한다(코드가 바인딩 유무로 갈린다).

name = "mir-yahoo"
main = "yahoo-proxy.js"
compatibility_date = "2026-09-01"

[ai]
binding = "AI"

# --- KV -----------------------------------------------------------------------
# id 는 `wrangler kv namespace list` 로 확인해 채운다(대시보드에서 만든 것과 동일 이름).
[[kv_namespaces]]
binding = "MOVE_CACHE"
id = "REPLACE_WITH_MOVE_CACHE_NAMESPACE_ID"

[[kv_namespaces]]
binding = "COMMUNITY_KV"
id = "REPLACE_WITH_COMMUNITY_KV_NAMESPACE_ID"

# --- Durable Object (선택, 유료 플랜) -------------------------------------------
# 켜면 /community* 전 요청이 CommunityStore 인스턴스 하나로 직렬화된다.
# 첫 요청 때 기존 COMMUNITY_KV 값(community:v1:posts / :votes)을 DO storage 로
# 한 번 복사해 오므로 기존 글은 유지된다.
[[durable_objects.bindings]]
name = "COMMUNITY_DO"
class_name = "CommunityStore"

[[migrations]]
tag = "v1"
new_classes = ["CommunityStore"]

# --- Secrets (선택, 2026-10-21) ---------------------------------------------------
#   wrangler secret put TURNSTILE_SECRET   # 있으면 커뮤니티 글·댓글·투표 쓰기에 Turnstile 검증 필수
#                                          # (없으면 검증 생략 = 기존 동작). 사이트 키는 프런트 market_config.js.

# --- Rate Limiting 바인딩 (선택, 2026-10-21) -----------------------------------------
# 이름이 RL_<버킷> 인 바인딩이 있으면 그 버킷은 KV 카운터 대신 바인딩으로 센다(KV 쓰기 0).
# 없거나 호출이 실패하면 기존 KV 고정창 그대로. 한도는 코드의 RATE_LIMIT_BUCKETS 와 같게
# 잡는 것을 권장한다(period 는 10 또는 60 만 가능 — 이 워커의 창은 전부 60초).
# namespace_id 는 계정 안에서 겹치지 않는 아무 정수 문자열.
# 필요한 것만 주석을 풀면 된다(커뮤니티 쓰기 4개가 KV 쓰기를 가장 많이 태운다).
# [[ratelimits]]
# name = "RL_POST"
# namespace_id = "1001"
# simple = { limit = 3, period = 60 }
#
# [[ratelimits]]
# name = "RL_COMMENT"
# namespace_id = "1002"
# simple = { limit = 6, period = 60 }
#
# [[ratelimits]]
# name = "RL_VOTE"
# namespace_id = "1003"
# simple = { limit = 5, period = 60 }
#
# [[ratelimits]]
# name = "RL_LIKE"
# namespace_id = "1004"
# simple = { limit = 30, period = 60 }
#
# 나머지 버킷(같은 형식): RL_REPORT 5 · RL_CLEAR 2 · RL_SYNC_PUT 10 · RL_CHAT 10 ·
# RL_SUMMARY 10 · RL_MOVE 6 · RL_EVNEWS 20 (전부 period = 60)
